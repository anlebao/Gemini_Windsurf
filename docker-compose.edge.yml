# Edge/Hybrid compose - v2 deployment for offline-capable stations
# ADR-001: SQLite local + NATS sync + PostgreSQL cloud (accounting always online)
# Architecture: Monolithic - CoreHub services loaded in-process by Gateway (no separate CoreHub container)
# Usage: docker compose -f docker-compose.edge.yml up -d
# NOTE: docker-compose.prod.yml (v1 SaaS) uses same monolithic architecture

services:
  postgres:
    image: postgres:15-alpine
    container_name: vanan-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-VanAnCoreHub}
      - POSTGRES_USER=${POSTGRES_USER:-vanan_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vanan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanan_admin} -d ${POSTGRES_DB:-VanAnCoreHub}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seq:
    image: datalust/seq:latest
    container_name: vanan-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq_data:/data
    networks:
      - vanan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nats:
    image: nats:2.10-alpine
    container_name: vanan-nats
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    volumes:
      - nats_data:/data/jetstream
    networks:
      - vanan-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-gateway:${IMAGE_TAG:-latest}
    container_name: vanan-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-VanAnCoreHub};Username=${POSTGRES_USER:-vanan_admin};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Nats=nats://nats:4222
      - Nats__Url=nats://nats:4222
      - Authentication__JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Secret=${JWT_SECRET_KEY}
      - Cors__AllowedOrigins__0=https://app.${VANAN_DOMAIN}
      - Cors__AllowedOrigins__1=https://diemthuong.${VANAN_DOMAIN}
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      # Phase 3.6: Explicit ShopERP BaseUrl — prevents port 5003 fallback
      - ShopERP__BaseUrl=http://shoperp:80/
    networks:
      - vanan-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ADR-001 v2 Edge: ShopERP uses SQLite local (persisted volume) instead of in-memory
  shoperp:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-shoperp:${IMAGE_TAG:-latest}
    container_name: vanan-shoperp
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - SQLITE_DB_PATH=Data Source=/data/shoperp.db
      - NATS__Url=nats://nats:4222
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - Authentication__Authority=https://api.${VANAN_DOMAIN}
      - ExternalUrls__KhachLink=https://diemthuong.${VANAN_DOMAIN}
      - Seed__OwnerUsername=${SHOPERP_OWNER_USERNAME:-adminvanan1}
      - Seed__OwnerPassword=${SHOPERP_OWNER_PASSWORD:-2026@vanan}
      - Seed__TenantId=${SHOPERP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      # WAVE 2 (2026-07-10): Accounting always online on PostgreSQL (ADR-001)
      # Edge compose: postgres available on same network — direct connection
      # True 2-server edge (ShopERP without postgres) = Tier 5 tech debt (HTTP via Gateway)
      - ConnectionStrings__AccountingConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-VanAnCoreHub};Username=${POSTGRES_USER:-vanan_admin};Password=${POSTGRES_PASSWORD}
    volumes:
      - shoperp_sqlite_data:/data    # ADR-001: persisted SQLite for edge station
    networks:
      - vanan-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ADR-001 v2 Edge: NATS sync worker — polls Outbox table, publishes events to NATS
  # Implemented in Wave 2 (ADR001-W3): NatsSyncWorker BackgroundService
  shoperp-nats-sync:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-shoperp:${IMAGE_TAG:-latest}
    container_name: vanan-shoperp-nats-sync
    command: ["dotnet", "VanAn.ShopERP.dll", "--sync-worker"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - SQLITE_DB_PATH=Data Source=/data/shoperp.db
      - NATS__Url=nats://nats:4222
      - Sync__PollIntervalMs=1000
      - Seed__TenantId=${SHOPERP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
    volumes:
      - shoperp_sqlite_data:/data    # shared volume with shoperp web app
    networks:
      - vanan-network
    depends_on:
      nats:
        condition: service_healthy
      shoperp:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  khachlink:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-khachlink:${IMAGE_TAG:-latest}
    container_name: vanan-khachlink
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Gateway__BaseUrl=https://api.${VANAN_DOMAIN}
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    networks:
      - vanan-network
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    container_name: vanan-nginx
    environment:
      - VANAN_DOMAIN=${VANAN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    networks:
      - vanan-network
    depends_on:
      - gateway
      - shoperp
      - khachlink
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: vanan-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
  seq_data:
  shoperp_sqlite_data:    # ADR-001 v2 Edge: persisted SQLite DB for ShopERP station
  certbot_www:
  certbot_conf:

networks:
  vanan-network:
    driver: bridge
