name: Accounting Tests

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - '1_Shared/**'
      - '2_Gateway/**'
      - '3_CoreHub/**'
      - '6_Tests/**'
      - '.github/workflows/test-accounting.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '1_Shared/**'
      - '2_Gateway/**'
      - '3_CoreHub/**'
      - '6_Tests/**'
      - '.github/workflows/test-accounting.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'VanAn.sln'

jobs:
  # Job 1: Unit Tests - Accounting
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Unit Tests - Accounting
        run: dotnet test 6_Tests/VanAn.Core.Tests/ --no-build --configuration Release --verbosity normal --logger trx --filter "FullyQualifiedName~Accounting" --collect:"XPlat Code Coverage" --parallel
        
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit-accounting
          path: '**/TestResults/*.trx'
          retention-days: 30

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-unit
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 30

  # Job 2: Integration Tests - Accounting
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Integration Tests - Accounting
        run: dotnet test 6_Tests/VanAn.Integration.Tests/ --configuration Release --verbosity normal --logger trx --filter "FullyQualifiedName~Accounting" --collect:"XPlat Code Coverage" --parallel
        
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration-accounting
          path: '**/TestResults/*.trx'
          retention-days: 30

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-integration
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 30

  # Job 3: Coverage Reporting
  coverage-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports
          pattern: coverage-reports-*
          merge-multiple: true

      - name: Generate Coverage Summary
        run: |
          echo "## Accounting Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Unit Tests:** ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Integration Tests:** ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports have been collected and uploaded as artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload Combined Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-combined
          path: coverage-reports/**/coverage.cobertura.xml
          retention-days: 30

  # Job 4: Test Summary
  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: Accounting Tests Summary
        run: |
          echo "## Accounting Tests Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Unit Tests:** ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Integration Tests:** ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Unit test results: Available as artifact" >> $GITHUB_STEP_SUMMARY
          echo "- Integration test results: Available as artifact" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports: Available as artifact" >> $GITHUB_STEP_SUMMARY