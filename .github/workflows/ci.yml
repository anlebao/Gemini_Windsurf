name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.devin/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.devin/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'VanAn.sln'

jobs:
  # Job 1: Build và Unit Tests
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Unit Tests - Core
        run: dotnet test 6_Tests/VanAn.Core.Tests/ --no-build --configuration Release --verbosity normal --logger trx
        
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit
          path: '**/TestResults/*.trx'
          retention-days: 30

  # Job 2: Architecture Tests
  architecture-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Architecture Tests
        run: dotnet test 6_Tests/VanAn.Architecture.Tests/ --configuration Release --verbosity normal --logger trx
        
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-architecture
          path: '**/TestResults/*.trx'
          retention-days: 30

  # Job 1c: Gateway Startup Tests — BLOCKING
  # Gateway is the single point of entry (KhachLink → Gateway → ShopERP).
  # DI failure in Gateway brings down ALL services. No WebApplicationFactory existed before.
  gateway-startup:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Gateway Startup Tests (DI + Smoke)
        run: |
          dotnet test 6_Tests/VanAn.Integration.Tests/ \
            --no-build --configuration Release \
            --filter "Category=Startup&ClassName~GatewayStartupTests" \
            --verbosity normal --logger trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-gateway-startup
          path: '**/TestResults/*.trx'
          retention-days: 30

  # Job 1b: KhachLink Startup Tests — BLOCKING
  # Validates KhachLink DI container + SSR smoke. Catches:
  #   - Missing AddScoped<X>() in Program.cs (silent until runtime on VPS)
  #   - JS interop in OnInitializedAsync during prerendering (500 crash)
  # This gap existed because CustomWebApplicationFactory only boots ShopERP.
  khachlink-startup:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: KhachLink Startup Tests (DI + Smoke)
        run: |
          dotnet test 6_Tests/VanAn.Integration.Tests/ \
            --no-build --configuration Release \
            --filter "Category=Startup" \
            --verbosity normal --logger trx

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-khachlink-startup
          path: '**/TestResults/*.trx'
          retention-days: 30

  # Job 2b: Integration Tests (NEW - Phase 2.1)
  integration-tests:
    if: false  # Disabled to save GitHub Actions minutes
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Integration Tests (CircuitBreaker only - no external services)
        run: dotnet test 6_Tests/VanAn.Integration.Tests/ --configuration Release --verbosity normal --logger trx --filter "FullyQualifiedName~CircuitBreakerIntegrationTests"
        
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration
          path: '**/TestResults/*.trx'
          retention-days: 30

  # Job 3: Guard Check (stub — Windows runner disabled to save Actions minutes)
  guard-check:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 2
    steps:
      - name: Guard Check Stub
        run: echo "Guard check delegated to pre-commit hook (runs locally). Build passed."

  # Job 4: Code Quality (Optional)
  code-quality:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release
        
      - name: Format Check
        run: echo "Format check skipped - collection expression rewrite causes CS0173 on Linux CI"
