name: E2E Tests

# Disabled automatic triggers — E2E tests are not appropriate for GitHub CI
# (require live services + DB + NATS; too slow + flaky on shared runners).
# Run manually via workflow_dispatch when needed, or locally via Playwright.
# Tracked separately in Phase 8 — Multi-VPS E2E Validation task card.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Specific test file to run (optional)'
        required: false
        default: ''
      browser:
        description: 'Browser to use'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  PLAYWRIGHT_VERSION: '1.40.x'

jobs:
  # Job 1: Build Applications
  build-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Restore
        run: dotnet restore VanAn.sln
      
      - name: Build Solution
        run: dotnet build VanAn.sln --no-restore --configuration Release
        
      - name: Publish ShopERP
        run: dotnet publish 5_WebApps/ShopERP/VanAn.ShopERP.csproj --no-build --configuration Release --output ./artifacts/shoperp

      - name: Publish Gateway
        run: dotnet publish 2_Gateway/VanAn.Gateway.csproj --no-build --configuration Release --output ./artifacts/gateway

      - name: Publish KhachLink
        run: dotnet publish 5_WebApps/KhachLink/VanAn.KhachLink.csproj --no-build --configuration Release --output ./artifacts/khachlink

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          path: ./artifacts/
          retention-days: 1

  # Job 2: Setup Playwright
  setup-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('6_Testing/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-
            ${{ runner.os }}-playwright-
      
      - name: Install Dependencies
        working-directory: 6_Testing
        run: npm install
        
      - name: Install Playwright Browsers
        working-directory: 6_Testing
        run: npx playwright install --with-deps ${{ github.event.inputs.browser || 'chromium' }}

  # Job 3: Run E2E Tests — PR tier (Smoke + Golden Path only, ~2 min)
  e2e-pr:
    runs-on: ubuntu-latest
    needs: [build-apps, setup-playwright]
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Playwright Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('6_Testing/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-

      - name: Install Dependencies
        working-directory: 6_Testing
        run: npm install

      - name: Install Playwright Browsers
        working-directory: 6_Testing
        run: npx playwright install --with-deps chromium

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-artifacts
          path: ./artifacts/

      - name: Start Services
        run: |
          dotnet ./artifacts/gateway/VanAn.Gateway.dll &
          dotnet ./artifacts/shoperp/VanAn.ShopERP.dll &
          dotnet ./artifacts/khachlink/VanAn.KhachLink.dll &

      - name: Wait for Services ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:5001/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5003/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5002/health; do sleep 2; done'

      - name: Run E2E Tests — Tier 0 (Smoke) + Tier 1 (Golden Path)
        working-directory: 6_Testing
        run: npx playwright test --project=tier-smoke --project=tier-golden
        env:
          CI: true
          ASPNETCORE_ENVIRONMENT: Development
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5003
          SHOPERP_URL: http://localhost:5003
          GATEWAY_URL: http://localhost:5001
          KHACHLINK_URL: http://localhost:5002

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-pr-results
          path: |
            6_Testing/playwright-report/
            6_Testing/test-results/
          retention-days: 7

  # Job 4: Run E2E Tests — Full regression (all tests, ~15 min)
  e2e-full:
    runs-on: ubuntu-latest
    needs: [build-apps, setup-playwright]
    timeout-minutes: 30
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Playwright Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('6_Testing/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-

      - name: Install Dependencies
        working-directory: 6_Testing
        run: npm install

      - name: Install Playwright Browsers
        working-directory: 6_Testing
        run: npx playwright install --with-deps ${{ github.event.inputs.browser || 'chromium' }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-artifacts
          path: ./artifacts/

      - name: Start Services
        run: |
          dotnet ./artifacts/gateway/VanAn.Gateway.dll &
          dotnet ./artifacts/shoperp/VanAn.ShopERP.dll &
          dotnet ./artifacts/khachlink/VanAn.KhachLink.dll &

      - name: Wait for Services ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:5001/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5003/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5002/health; do sleep 2; done'

      - name: Run E2E Tests — Full Regression (Tier 2)
        working-directory: 6_Testing
        run: |
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            npx playwright test ${{ github.event.inputs.spec }} --project=${{ github.event.inputs.browser || 'chromium' }}
          else
            npx playwright test --project=tier-full --grep-invert "@slow"
          fi
        env:
          CI: true
          ASPNETCORE_ENVIRONMENT: Development
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5003
          SHOPERP_URL: http://localhost:5003
          GATEWAY_URL: http://localhost:5001
          KHACHLINK_URL: http://localhost:5002

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-full-results
          path: |
            6_Testing/playwright-report/
            6_Testing/test-results/
          retention-days: 30

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            6_Testing/reports/
          retention-days: 30

  # Job 4: Quality Gate Summary
  quality-gate:
    runs-on: ubuntu-latest
    needs: [build-apps, e2e-pr, e2e-full]
    if: always()
    timeout-minutes: 5

    steps:
      - name: E2E Test Summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.e2e-pr.result }}" == "success" ] || [ "${{ needs.e2e-full.result }}" == "success" ]; then
            echo "✅ E2E Tests Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-pr.result }}" == "skipped" ] && [ "${{ needs.e2e-full.result }}" == "skipped" ]; then
            echo "⏭️ E2E Tests Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ E2E Tests Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts available for download" >> $GITHUB_STEP_SUMMARY
