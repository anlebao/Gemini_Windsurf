name: CD Multi-VPS

# Multi-VPS deployment (Option C) — Gateway VPS + ShopERP VPS on separate Google Cloud machines.
# Trigger: push to main (Google Cloud production) OR manual workflow_dispatch.
# Oracle VPS uses cd.yml on branch 'oracle-prod' — completely separate.
# Prerequisites: GitHub Secrets configured (see docs/operations/Multi_VPS_Deployment_Guide.md §3.A).

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '5_WebApps/ShopERP/wwwroot/guides/**'
      - '.devin/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
      skip_build:
        description: 'Skip build (use existing images)'
        type: boolean
        required: false
        default: false

concurrency:
  group: cd-multivps-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Immutable image tag for this run (full git SHA). VPS deploys this exact tag;
  # rollback = redeploy the previous SHA (see docs/operations/rollback.md).
  # workflow_dispatch can override with image_tag input (manual/full deploys).
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  # ============================================================
  # Job 0: Change impact analysis (P0 foundation — single source of truth:
  # deployment-impact.yml). Computes deploy/build/verification sets.
  # SAFETY: fail-closed — any analysis error -> FULL deploy.
  # Never allow a scoped deploy when impact is unknown.
  # ============================================================
  impact-analysis:
    name: Impact Analysis
    runs-on: ubuntu-latest
    outputs:
      deploy_action: ${{ steps.impact.outputs.deploy_action }}
      deploy_set: ${{ steps.impact.outputs.deploy_set }}
      nginx_changed: ${{ steps.impact.outputs.nginx_changed }}
      verification_set: ${{ steps.impact.outputs.verification_set }}
    steps:
      - name: Checkout (full history for diff base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute impact set
        id: impact
        shell: pwsh
        run: |
          $BASE = "${{ github.event.before }}"
          $result = $null
          try {
            if ($env:GITHUB_EVENT_NAME -eq "push" -and $BASE -and $BASE -ne "0000000000000000000000000000000000000000") {
              $result = ./scripts/impact-analysis.ps1 -DiffBase $BASE -Json | ConvertFrom-Json
            } else {
              Write-Host "Manual dispatch or no diff base -> fail-closed FULL"
            }
          } catch {
            Write-Host "::warning::Impact analysis failed: $($_.Exception.Message) -> fail-closed FULL"
          }
          if (-not $result) {
            $result = [PSCustomObject]@{
              deploy_action    = "full"
              deploy_set       = @("gateway", "khachlink", "shoperp", "directory", "crawler")
              nginx_changed    = $false
              verification_set = @("build", "unit", "integration", "startup", "deploy_smoke", "targeted_rv")
            }
          }
          "deploy_action=$($result.deploy_action)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "deploy_set=$($result.deploy_set -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "nginx_changed=$($result.nginx_changed)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "verification_set=$($result.verification_set -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "deploy_action=$($result.deploy_action) deploy_set=[$($result.deploy_set -join ',')] nginx_changed=$($result.nginx_changed)"

  # ============================================================
  # Job 1: Build & push Docker images to GHCR (matrix, scoped by impact set,
  #         layer-cached via GHCR cache registry)
  # ============================================================
  build-and-push:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: impact-analysis
    if: ${{ github.event.inputs.skip_build != 'true' && needs.impact-analysis.outputs.deploy_action != 'noop' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: gateway
            file: 2_Gateway/Dockerfile
            image: vanan-gateway
          - app: shoperp
            file: 5_WebApps/ShopERP/Dockerfile
            image: vanan-shoperp
          - app: khachlink
            file: 5_WebApps/KhachLink/Dockerfile
            image: vanan-khachlink
          - app: directory
            file: 5_WebApps/Directory/Dockerfile
            image: vanan-directory
          - app: crawler
            file: 7_Tooling/VanAn.Crawler/Dockerfile
            image: vanan-crawler

    outputs:
      image_tag: ${{ env.IMAGE_TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.app }}
        if: ${{ contains(needs.impact-analysis.outputs.deploy_set, matrix.app) }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:cache,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ============================================================
  # Job 2: Pre-Deployment Validation (BLOCKING)
  # ============================================================
  pre-deployment-validation:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    needs: [impact-analysis, build-and-push]
    if: ${{ !cancelled() && needs.impact-analysis.outputs.deploy_action != 'noop' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Multi-VPS Compose Files
        run: |
          echo "Validating docker-compose.gateway.yml..."
          docker compose -f docker-compose.gateway.yml config > /dev/null && echo "gateway OK"
          echo "Validating docker-compose.khachlink.yml..."
          docker compose -f docker-compose.khachlink.yml config > /dev/null && echo "khachlink OK"
          echo "Validating docker-compose.directory.yml..."
          docker compose -f docker-compose.directory.yml config > /dev/null && echo "directory OK"
          echo "Validating docker-compose.shoperp.yml..."
          docker compose -f docker-compose.shoperp.yml config > /dev/null && echo "shoperp OK"

      - name: Verify required secrets are set
        env:
          VPS_GATEWAY_HOST: ${{ secrets.VPS_GATEWAY_HOST }}
          VPS_GATEWAY_USER: ${{ secrets.VPS_GATEWAY_USER }}
          VPS_GATEWAY_SSH_PRIVATE_KEY: ${{ secrets.VPS_GATEWAY_SSH_PRIVATE_KEY }}
          VPS_SHOP_HOST: ${{ secrets.VPS_SHOP_HOST }}
          VPS_SHOP_USER: ${{ secrets.VPS_SHOP_USER }}
          VPS_SHOP_SSH_PRIVATE_KEY: ${{ secrets.VPS_SHOP_SSH_PRIVATE_KEY }}
          VPS_KHACHLINK_HOST: ${{ secrets.VPS_KHACHLINK_HOST }}
          VPS_KHACHLINK_USER: ${{ secrets.VPS_KHACHLINK_USER }}
          VPS_KHACHLINK_SSH_PRIVATE_KEY: ${{ secrets.VPS_KHACHLINK_SSH_PRIVATE_KEY }}
          SHOPERP_REMOTE_HOST: ${{ secrets.SHOPERP_REMOTE_HOST }}
          GATEWAY_REMOTE_HOST: ${{ secrets.GATEWAY_REMOTE_HOST }}
          KHACHLINK_REMOTE_HOST: ${{ secrets.KHACHLINK_REMOTE_HOST }}
          SHOP_INSTANCE_ID: ${{ secrets.SHOP_INSTANCE_ID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SEQ_ADMIN_PASSWORD: ${{ secrets.SEQ_ADMIN_PASSWORD }}
          VANAN_DOMAIN: ${{ secrets.VANAN_DOMAIN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          missing=0
          for var_name in VPS_GATEWAY_HOST VPS_GATEWAY_USER VPS_GATEWAY_SSH_PRIVATE_KEY \
                          VPS_SHOP_HOST VPS_SHOP_USER VPS_SHOP_SSH_PRIVATE_KEY \
                          VPS_KHACHLINK_HOST VPS_KHACHLINK_USER VPS_KHACHLINK_SSH_PRIVATE_KEY \
                          SHOPERP_REMOTE_HOST GATEWAY_REMOTE_HOST KHACHLINK_REMOTE_HOST SHOP_INSTANCE_ID \
                          POSTGRES_PASSWORD JWT_SECRET_KEY SEQ_ADMIN_PASSWORD \
                          VANAN_DOMAIN VAPID_PRIVATE_KEY; do
            val=$(eval echo "\$${var_name}")
            if [ -z "$val" ]; then
              echo "::error::Missing GitHub secret: $var_name"
              missing=$((missing+1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::error::$missing required secrets are missing. See Multi_VPS_Deployment_Guide.md §3.A."
            exit 1
          fi
          echo "All required secrets are set."

          # Validate SSH key format for all 3 VPS keys (CRLF + ssh-keygen)
          echo "=== SSH Key Format Validation (all 3 VPS) ==="
          key_fail=0
          for kv in "VPS_GATEWAY_SSH_PRIVATE_KEY:$VPS_GATEWAY_SSH_PRIVATE_KEY" \
                    "VPS_SHOP_SSH_PRIVATE_KEY:$VPS_SHOP_SSH_PRIVATE_KEY" \
                    "VPS_KHACHLINK_SSH_PRIVATE_KEY:$VPS_KHACHLINK_SSH_PRIVATE_KEY"; do
            kname="${kv%%:*}"
            kval="${kv#*:}"
            kfile="/tmp/${kname}.key"
            printf '%s\n' "$kval" > "$kfile"
            chmod 600 "$kfile"
            echo "--- $kname ---"
            echo "  length: $(wc -c < "$kfile") bytes"
            if grep -q $'\r' "$kfile"; then
              echo "::error::$kname has CRLF line endings — regenerate without CRLF."
              key_fail=$((key_fail+1))
            fi
            if ! ssh-keygen -lf "$kfile" >/dev/null 2>&1; then
              echo "::error::$kname is not a valid SSH private key (ssh-keygen -lf failed)."
              key_fail=$((key_fail+1))
            else
              echo "  fingerprint: $(ssh-keygen -lf "$kfile" 2>&1)"
            fi
            rm -f "$kfile"
          done
          if [ $key_fail -gt 0 ]; then
            echo "::error::$key_fail SSH key validation failure(s). Fix GitHub secrets (LF line endings, valid OpenSSH format)."
            exit 1
          fi
          echo "All 3 SSH keys validated (LF endings, valid format)."

          # DIAGNOSTIC: Verify Gateway SSH key fingerprint matches local key
          echo "=== Gateway SSH Key Diagnostic ==="
          printf '%s\n' "$VPS_GATEWAY_SSH_PRIVATE_KEY" > /tmp/gw_key
          chmod 600 /tmp/gw_key
          echo "Key length (bytes): $(wc -c < /tmp/gw_key)"
          echo "Key first 20 chars: $(head -c 20 /tmp/gw_key | od -An -c | head -1)"
          echo "Key last 20 chars: $(tail -c 20 /tmp/gw_key | od -An -c | head -1)"
          echo "Key has CRLF: $(grep -c $'\r' /tmp/gw_key || echo 0)"
          FP=$(ssh-keygen -lf /tmp/gw_key 2>&1)
          echo "Fingerprint result length: ${#FP}"
          echo "Fingerprint contains SHA256: $(echo "$FP" | grep -c SHA256 || echo 0)"
          echo "Expected: 2048 SHA256:7po3REun23JbI9KszqFcqtlnSZJqHXMlNSvLLhW3CaA"
          rm -f /tmp/gw_key

  # ============================================================
  # Job 3: Deploy to Gateway VPS
  # ============================================================
  deploy-gateway:
    name: Deploy to Gateway VPS
    runs-on: ubuntu-latest
    needs: [impact-analysis, build-and-push, pre-deployment-validation]
    # Runs when impact set includes gateway OR crawler (crawler lives in this compose).
    # !failure() = proceed when needs are success or skipped, but never after a failure.
    if: ${{ !cancelled() && !failure() && (contains(needs.impact-analysis.outputs.deploy_set, 'gateway') || contains(needs.impact-analysis.outputs.deploy_set, 'crawler')) }}
    timeout-minutes: 60
    environment: production-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory on Gateway VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_GATEWAY_HOST }}
          username: ${{ secrets.VPS_GATEWAY_USER }}
          key: ${{ secrets.VPS_GATEWAY_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/vanan
            ls -la /opt/vanan
            whoami
            # Check disk space + cleanup unused docker images (prevent SCP fail from disk full)
            echo "=== Disk space before cleanup ==="
            df -h / || true
            echo "=== Docker disk usage ==="
            sudo docker system df || true
            echo "=== Cleaning unused docker images ==="
            sudo docker image prune -af --filter "until=48h" || true
            echo "=== Disk space after cleanup ==="
            df -h / || true

      - name: Validate SSH connectivity to Gateway VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_GATEWAY_HOST }}
          username: ${{ secrets.VPS_GATEWAY_USER }}
          key: ${{ secrets.VPS_GATEWAY_SSH_PRIVATE_KEY }}
          script: |
            echo "SSH connection successful"
            which scp || echo "Warning: scp not found"
            ls -la /opt/vanan || echo "Target directory doesn't exist yet"

      - name: Copy Gateway deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_GATEWAY_HOST }}
          username: ${{ secrets.VPS_GATEWAY_USER }}
          key: ${{ secrets.VPS_GATEWAY_SSH_PRIVATE_KEY }}
          source: "docker-compose.gateway.yml,nginx/,scripts/deploy-gateway.sh,scripts/init-ssl-multivps.sh"
          target: "/opt/vanan"
          overwrite: true
          debug: true

      - name: Bootstrap & Deploy Gateway
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_GATEWAY_HOST }}
          username: ${{ secrets.VPS_GATEWAY_USER }}
          key: ${{ secrets.VPS_GATEWAY_SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: DEPLOY_POSTGRES_PASSWORD,DEPLOY_JWT_SECRET_KEY,DEPLOY_SEQ_PASSWORD,DEPLOY_GITHUB_TOKEN,DEPLOY_GITHUB_ACTOR,DEPLOY_REGISTRY,DEPLOY_REPO_OWNER,DEPLOY_IMAGE_TAG,DEPLOY_VANAN_DOMAIN,DEPLOY_SHOPERP_REMOTE_HOST,DEPLOY_KHACHLINK_REMOTE_HOST,DEPLOY_GOOGLE_CLIENT_ID,DEPLOY_GOOGLE_CLIENT_SECRET,DEPLOY_VAPID_PRIVATE_KEY,DEPLOY_INTERNAL_LOYALTY_API_KEY,DEPLOY_SHOP_INSTANCE_ID,DEPLOY_R2_ACCESS_KEY,DEPLOY_R2_SECRET_KEY,DEPLOY_GODADDY_API_KEY,DEPLOY_VPS_GATEWAY_HOST
          script: |
            set -e

            # Bootstrap Docker (idempotent)
            if ! command -v docker > /dev/null 2>&1; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi
            if ! sudo docker compose version > /dev/null 2>&1; then
              echo "Installing Docker Compose plugin..."
              sudo apt-get update -qq && sudo apt-get install -y docker-compose-plugin
            fi

            cd /opt/vanan

            # Write .env.gateway (preserve existing Google/VAPID/KhachLink flag if GitHub secrets are empty)
            EXISTING_GOOGLE_ID=$(grep -E '^GOOGLE_CLIENT_ID=' .env.gateway 2>/dev/null | cut -d= -f2- || echo "")
            EXISTING_GOOGLE_SECRET=$(grep -E '^GOOGLE_CLIENT_SECRET=' .env.gateway 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_GOOGLE_ID="${DEPLOY_GOOGLE_CLIENT_ID:-$EXISTING_GOOGLE_ID}"
            FINAL_GOOGLE_SECRET="${DEPLOY_GOOGLE_CLIENT_SECRET:-$EXISTING_GOOGLE_SECRET}"
            EXISTING_VAPID_KEY=$(grep -E '^VAPID_PRIVATE_KEY=' .env.gateway 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_VAPID_KEY="${DEPLOY_VAPID_PRIVATE_KEY:-$EXISTING_VAPID_KEY}"
            # Preserve KhachLink Multi-Profile flag (set by r1-enable.yml workflow)
            EXISTING_KHACHLINK_FLAG=$(grep -E '^KHACHLINK_MULTIPROFILE_ENABLED=' .env.gateway 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_KHACHLINK_FLAG="${EXISTING_KHACHLINK_FLAG:-false}"
            # #130: Preserve existing R2 credentials if GitHub secrets are empty
            EXISTING_R2_ACCESS_KEY=$(grep -E '^R2_ACCESS_KEY=' .env.gateway 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_R2_ACCESS_KEY="${DEPLOY_R2_ACCESS_KEY:-$EXISTING_R2_ACCESS_KEY}"
            EXISTING_R2_SECRET_KEY=$(grep -E '^R2_SECRET_KEY=' .env.gateway 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_R2_SECRET_KEY="${DEPLOY_R2_SECRET_KEY:-$EXISTING_R2_SECRET_KEY}"
            # Domain Reseller R1: Preserve existing GoDaddy API key if GitHub secret is empty
            EXISTING_GODADDY_KEY=$(grep -E '^GODADDY_API_KEY=' .env.gateway 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_GODADDY_KEY="${DEPLOY_GODADDY_API_KEY:-$EXISTING_GODADDY_KEY}"
            # 2026-09-21/22: Preserve crawler runtime config set manually on the VPS
            # (doanhnghiep.vn API key + GDT fallback flag) — CD must NOT drop them.
            EXISTING_DN_KEY=$(grep -E '^DOANHNGHIEP_API_KEY=' .env.gateway 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_DN_KEY="${EXISTING_DN_KEY:-}"
            EXISTING_GDT_FLAG=$(grep -E '^CRAWLER_GDT_LOOKUP_ENABLED=' .env.gateway 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_GDT_FLAG="${EXISTING_GDT_FLAG:-false}"

            printf '%s\n' \
              "VANAN_DOMAIN=${DEPLOY_VANAN_DOMAIN}" \
              "SHOPERP_REMOTE_HOST=${DEPLOY_SHOPERP_REMOTE_HOST}" \
              "KHACHLINK_REMOTE_HOST=${DEPLOY_KHACHLINK_REMOTE_HOST}" \
              "POSTGRES_DB=VanAnCoreHub" \
              "POSTGRES_USER=vanan_admin" \
              "POSTGRES_PASSWORD=${DEPLOY_POSTGRES_PASSWORD}" \
              "JWT_SECRET_KEY=${DEPLOY_JWT_SECRET_KEY}" \
              "SEQ_ADMIN_PASSWORD=${DEPLOY_SEQ_PASSWORD}" \
              "IMAGE_PREFIX=${DEPLOY_REGISTRY}/${DEPLOY_REPO_OWNER}" \
              "IMAGE_TAG=${DEPLOY_IMAGE_TAG}" \
              "INTERNAL_LOYALTY_API_KEY=${DEPLOY_INTERNAL_LOYALTY_API_KEY}" \
              "GOOGLE_CLIENT_ID=${FINAL_GOOGLE_ID}" \
              "GOOGLE_CLIENT_SECRET=${FINAL_GOOGLE_SECRET}" \
              "VAPID_PRIVATE_KEY=${FINAL_VAPID_KEY}" \
              "SHOP_INSTANCE_ID=${DEPLOY_SHOP_INSTANCE_ID}" \
              "KHACHLINK_MULTIPROFILE_ENABLED=${FINAL_KHACHLINK_FLAG}" \
              "R2_ENDPOINT=https://18947627801f833aecc202f086d66af5.r2.cloudflarestorage.com" \
              "R2_ACCESS_KEY=${FINAL_R2_ACCESS_KEY}" \
              "R2_SECRET_KEY=${FINAL_R2_SECRET_KEY}" \
              "R2_BUCKET_NAME=vanan-guard-photos" \
              "GODADDY_API_KEY=${FINAL_GODADDY_KEY}" \
              "GODADDY_API_URL=https://api.godaddy.com" \
              "DOMAIN_REGISTRAR_DEFAULT_VPS_IP=${DEPLOY_VPS_GATEWAY_HOST:-}" \
              "CRAWLER_GATEWAY_USERNAME=sysadmin@vanan.vn" \
              "CRAWLER_GATEWAY_PASSWORD=2026@vanan" \
              "DOANHNGHIEP_API_KEY=${FINAL_DN_KEY}" \
              "CRAWLER_GDT_LOOKUP_ENABLED=${FINAL_GDT_FLAG}" \
              > .env.gateway

            # Login to GHCR
            echo "${DEPLOY_GITHUB_TOKEN}" | sudo docker login ghcr.io -u "${DEPLOY_GITHUB_ACTOR}" --password-stdin

            # Pull & restart (with retry — transient network resets from ghcr.io CDN)
            for i in 1 2 3 4 5; do
              timeout 600 sudo docker compose -f docker-compose.gateway.yml --env-file .env.gateway pull && break
              echo "⚠️ Pull attempt $i failed, retrying in 15s..."
              sleep 15
            done
            # 2026-09-24 (deploy-window fix): --wait healthcheck gate — the recreate
            # (stop old → start new) no longer relies on a blind `sleep 60`; CD waits
            # until the new container reports healthy (or fails fast with logs).
            # nginx proxy_next_upstream retries absorb the brief restart gap for users.
            sudo docker compose -f docker-compose.gateway.yml --env-file .env.gateway up -d --remove-orphans --wait --wait-timeout 240

            # Final state
            sudo docker compose -f docker-compose.gateway.yml --env-file .env.gateway ps
            echo "Gateway VPS deploy complete!"
        env:
          DEPLOY_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DEPLOY_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEPLOY_SEQ_PASSWORD: ${{ secrets.SEQ_ADMIN_PASSWORD }}
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_REPO_OWNER: ${{ github.repository_owner }}
          DEPLOY_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_VANAN_DOMAIN: ${{ secrets.VANAN_DOMAIN }}
          DEPLOY_SHOPERP_REMOTE_HOST: ${{ secrets.SHOPERP_REMOTE_HOST }}
          DEPLOY_KHACHLINK_REMOTE_HOST: ${{ secrets.KHACHLINK_REMOTE_HOST }}
          DEPLOY_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          DEPLOY_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEPLOY_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DEPLOY_INTERNAL_LOYALTY_API_KEY: ${{ secrets.INTERNAL_LOYALTY_API_KEY }}
          DEPLOY_SHOP_INSTANCE_ID: ${{ secrets.SHOP_INSTANCE_ID }}
          DEPLOY_R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          DEPLOY_R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          # Domain Reseller R1: GoDaddy API key for tenant domain DNS automation
          DEPLOY_GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          # VPS Gateway host IP — used for auto A record when linking tenant domains
          DEPLOY_VPS_GATEWAY_HOST: ${{ secrets.VPS_GATEWAY_HOST }}

      # Conditional nginx recreate — ONLY when root ./nginx/** changed (impact analysis).
      # Bind-mount changes are NOT detected by `docker compose up -d`; the entrypoint
      # re-runs envsubst on recreate. Skipping when nginx is untouched avoids an
      # unnecessary restart window (this was the cause of avoidable 502 gaps).
      - name: Force-recreate nginx (nginx config changed)
        if: ${{ needs.impact-analysis.outputs.nginx_changed == 'true' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_GATEWAY_HOST }}
          username: ${{ secrets.VPS_GATEWAY_USER }}
          key: ${{ secrets.VPS_GATEWAY_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            cd /opt/vanan
            sudo docker compose -f docker-compose.gateway.yml --env-file .env.gateway up -d --force-recreate nginx --wait --wait-timeout 120
            sudo docker compose -f docker-compose.gateway.yml --env-file .env.gateway ps

  # ============================================================
  # Job 4: Deploy to KhachLink VPS (runs AFTER Gateway to ensure API is up)
  # ============================================================
  deploy-khachlink:
    name: Deploy to KhachLink VPS
    runs-on: ubuntu-latest
    needs: [impact-analysis, build-and-push, pre-deployment-validation, deploy-gateway]
    # Runs when impact set includes khachlink OR directory (directory SSR container
    # lives in the khachlink compose on this VPS). Gateway-first ordering kept.
    if: ${{ !cancelled() && !failure() && (contains(needs.impact-analysis.outputs.deploy_set, 'khachlink') || contains(needs.impact-analysis.outputs.deploy_set, 'directory')) }}
    timeout-minutes: 60
    environment: production-khachlink

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory on KhachLink VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_KHACHLINK_HOST }}
          username: ${{ secrets.VPS_KHACHLINK_USER }}
          key: ${{ secrets.VPS_KHACHLINK_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/vanan
            ls -la /opt/vanan
            whoami
            # Free disk space from old docker images (prevent SCP/deploy fail from disk full)
            sudo docker image prune -af --filter "until=48h" || true

      - name: Validate SSH connectivity to KhachLink VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_KHACHLINK_HOST }}
          username: ${{ secrets.VPS_KHACHLINK_USER }}
          key: ${{ secrets.VPS_KHACHLINK_SSH_PRIVATE_KEY }}
          script: |
            echo "SSH connection successful"
            which scp || echo "Warning: scp not found"
            ls -la /opt/vanan || echo "Target directory doesn't exist yet"

      - name: Copy KhachLink deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_KHACHLINK_HOST }}
          username: ${{ secrets.VPS_KHACHLINK_USER }}
          key: ${{ secrets.VPS_KHACHLINK_SSH_PRIVATE_KEY }}
          source: "docker-compose.khachlink.yml,scripts/deploy-khachlink.sh,scripts/add-directory-domain.sh"
          target: "/opt/vanan"
          overwrite: true
          debug: true
          strip_leading_slash: false

      - name: Bootstrap & Deploy KhachLink
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_KHACHLINK_HOST }}
          username: ${{ secrets.VPS_KHACHLINK_USER }}
          key: ${{ secrets.VPS_KHACHLINK_SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: DEPLOY_SEQ_PASSWORD,DEPLOY_GITHUB_TOKEN,DEPLOY_GITHUB_ACTOR,DEPLOY_REGISTRY,DEPLOY_REPO_OWNER,DEPLOY_IMAGE_TAG,DEPLOY_VANAN_DOMAIN,DEPLOY_GATEWAY_REMOTE_HOST,DEPLOY_GOOGLE_CLIENT_ID,DEPLOY_GOOGLE_CLIENT_SECRET,DEPLOY_VAPID_PRIVATE_KEY
          script: |
            set -e

            # Bootstrap Docker (idempotent)
            if ! command -v docker > /dev/null 2>&1; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi
            if ! sudo docker compose version > /dev/null 2>&1; then
              echo "Installing Docker Compose plugin..."
              sudo apt-get update -qq && sudo apt-get install -y docker-compose-plugin
            fi

            cd /opt/vanan

            # Write .env.khachlink (preserve existing Google/VAPID if GitHub secrets are empty)
            EXISTING_GOOGLE_ID=$(grep -E '^GOOGLE_CLIENT_ID=' .env.khachlink 2>/dev/null | cut -d= -f2- || echo "")
            EXISTING_GOOGLE_SECRET=$(grep -E '^GOOGLE_CLIENT_SECRET=' .env.khachlink 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_GOOGLE_ID="${DEPLOY_GOOGLE_CLIENT_ID:-$EXISTING_GOOGLE_ID}"
            FINAL_GOOGLE_SECRET="${DEPLOY_GOOGLE_CLIENT_SECRET:-$EXISTING_GOOGLE_SECRET}"
            EXISTING_VAPID_KEY=$(grep -E '^VAPID_PRIVATE_KEY=' .env.khachlink 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_VAPID_KEY="${DEPLOY_VAPID_PRIVATE_KEY:-$EXISTING_VAPID_KEY}"

            printf '%s\n' \
              "VANAN_DOMAIN=${DEPLOY_VANAN_DOMAIN}" \
              "GATEWAY_REMOTE_HOST=${DEPLOY_GATEWAY_REMOTE_HOST}" \
              "SEQ_ADMIN_PASSWORD=${DEPLOY_SEQ_PASSWORD}" \
              "IMAGE_PREFIX=${DEPLOY_REGISTRY}/${DEPLOY_REPO_OWNER}" \
              "IMAGE_TAG=${DEPLOY_IMAGE_TAG}" \
              "GOOGLE_CLIENT_ID=${FINAL_GOOGLE_ID}" \
              "GOOGLE_CLIENT_SECRET=${FINAL_GOOGLE_SECRET}" \
              "VAPID_PRIVATE_KEY=${FINAL_VAPID_KEY}" \
              > .env.khachlink

            # Login to GHCR
            echo "${DEPLOY_GITHUB_TOKEN}" | sudo docker login ghcr.io -u "${DEPLOY_GITHUB_ACTOR}" --password-stdin

            # Pull & restart (with retry — transient network resets from ghcr.io CDN)
            for i in 1 2 3 4 5; do
              timeout 600 sudo docker compose -f docker-compose.khachlink.yml --env-file .env.khachlink pull && break
              echo "⚠️ Pull attempt $i failed, retrying in 15s..."
              sleep 15
            done
            # 2026-09-24 (deploy-window fix): healthcheck gate — wait for the new
            # container to be healthy instead of a blind sleep (same as Gateway VPS).
            sudo docker compose -f docker-compose.khachlink.yml --env-file .env.khachlink up -d --remove-orphans --wait --wait-timeout 240

            # Final state
            sudo docker compose -f docker-compose.khachlink.yml --env-file .env.khachlink ps

            # Directory SSR health check (non-blocking — container may not exist if image not yet built)
            echo "=== Directory SSR health check ==="
            if sudo docker compose -f docker-compose.khachlink.yml --env-file .env.khachlink ps directory 2>/dev/null | grep -q "Up"; then
              curl -fsS --max-time 15 http://localhost:8080/health && echo "Directory health OK" || echo "::warning::Directory health check failed (non-blocking)"
            else
              echo "Directory container not running (may not be deployed yet — non-blocking)"
            fi

            echo "KhachLink VPS deploy complete!"
        env:
          DEPLOY_SEQ_PASSWORD: ${{ secrets.SEQ_ADMIN_PASSWORD }}
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_REPO_OWNER: ${{ github.repository_owner }}
          DEPLOY_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_VANAN_DOMAIN: ${{ secrets.VANAN_DOMAIN }}
          DEPLOY_GATEWAY_REMOTE_HOST: ${{ secrets.GATEWAY_REMOTE_HOST }}
          DEPLOY_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          DEPLOY_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEPLOY_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

  # ============================================================
  # Job 5: Deploy to ShopERP VPS (runs AFTER Gateway to ensure NATS+PG are up)
  # ============================================================
  deploy-shoperp:
    name: Deploy to ShopERP VPS
    runs-on: ubuntu-latest
    needs: [impact-analysis, build-and-push, pre-deployment-validation, deploy-gateway]
    # Runs only when the impact set includes shoperp. Gateway-first ordering kept.
    if: ${{ !cancelled() && !failure() && contains(needs.impact-analysis.outputs.deploy_set, 'shoperp') }}
    timeout-minutes: 60
    environment: production-shoperp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory on ShopERP VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_SHOP_HOST }}
          username: ${{ secrets.VPS_SHOP_USER }}
          key: ${{ secrets.VPS_SHOP_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/vanan
            ls -la /opt/vanan
            whoami
            # Free disk space from old docker images (prevent SCP/deploy fail from disk full)
            sudo docker image prune -af --filter "until=48h" || true

      - name: Validate SSH connectivity to ShopERP VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_SHOP_HOST }}
          username: ${{ secrets.VPS_SHOP_USER }}
          key: ${{ secrets.VPS_SHOP_SSH_PRIVATE_KEY }}
          script: |
            echo "SSH connection successful"
            which scp || echo "Warning: scp not found"
            ls -la /opt/vanan || echo "Target directory doesn't exist yet"

      - name: Copy ShopERP deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SHOP_HOST }}
          username: ${{ secrets.VPS_SHOP_USER }}
          key: ${{ secrets.VPS_SHOP_SSH_PRIVATE_KEY }}
          source: "docker-compose.shoperp.yml,scripts/deploy-shoperp.sh"
          target: "/opt/vanan"
          overwrite: true
          debug: true
          strip_leading_slash: false

      - name: Bootstrap & Deploy ShopERP
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_SHOP_HOST }}
          username: ${{ secrets.VPS_SHOP_USER }}
          key: ${{ secrets.VPS_SHOP_SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: DEPLOY_POSTGRES_PASSWORD,DEPLOY_JWT_SECRET_KEY,DEPLOY_GITHUB_TOKEN,DEPLOY_GITHUB_ACTOR,DEPLOY_REGISTRY,DEPLOY_REPO_OWNER,DEPLOY_IMAGE_TAG,DEPLOY_VANAN_DOMAIN,DEPLOY_NATS_REMOTE_HOST,DEPLOY_GATEWAY_REMOTE_HOST,DEPLOY_SHOP_INSTANCE_ID,DEPLOY_GOOGLE_CLIENT_ID,DEPLOY_GOOGLE_CLIENT_SECRET,DEPLOY_VAPID_PRIVATE_KEY,DEPLOY_INTERNAL_LOYALTY_API_KEY
          script: |
            set -e

            # Bootstrap Docker (idempotent)
            if ! command -v docker > /dev/null 2>&1; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi
            if ! sudo docker compose version > /dev/null 2>&1; then
              echo "Installing Docker Compose plugin..."
              sudo apt-get update -qq && sudo apt-get install -y docker-compose-plugin
            fi

            cd /opt/vanan

            # Write .env.shoperp (preserve existing Google/VAPID if GitHub secrets are empty)
            EXISTING_GOOGLE_ID=$(grep -E '^GOOGLE_CLIENT_ID=' .env.shoperp 2>/dev/null | cut -d= -f2- || echo "")
            EXISTING_GOOGLE_SECRET=$(grep -E '^GOOGLE_CLIENT_SECRET=' .env.shoperp 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_GOOGLE_ID="${DEPLOY_GOOGLE_CLIENT_ID:-$EXISTING_GOOGLE_ID}"
            FINAL_GOOGLE_SECRET="${DEPLOY_GOOGLE_CLIENT_SECRET:-$EXISTING_GOOGLE_SECRET}"
            EXISTING_VAPID_KEY=$(grep -E '^VAPID_PRIVATE_KEY=' .env.shoperp 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_VAPID_KEY="${DEPLOY_VAPID_PRIVATE_KEY:-$EXISTING_VAPID_KEY}"

            printf '%s\n' \
              "VANAN_DOMAIN=${DEPLOY_VANAN_DOMAIN}" \
              "NATS_REMOTE_HOST=${DEPLOY_NATS_REMOTE_HOST}" \
              "GATEWAY_REMOTE_HOST=${DEPLOY_GATEWAY_REMOTE_HOST}" \
              "SHOP_INSTANCE_ID=${DEPLOY_SHOP_INSTANCE_ID}" \
              "POSTGRES_DB=VanAnCoreHub" \
              "POSTGRES_USER=vanan_admin" \
              "POSTGRES_PASSWORD=${DEPLOY_POSTGRES_PASSWORD}" \
              "JWT_SECRET_KEY=${DEPLOY_JWT_SECRET_KEY}" \
              "IMAGE_PREFIX=${DEPLOY_REGISTRY}/${DEPLOY_REPO_OWNER}" \
              "IMAGE_TAG=${DEPLOY_IMAGE_TAG}" \
              "INTERNAL_LOYALTY_API_KEY=${DEPLOY_INTERNAL_LOYALTY_API_KEY}" \
              "GOOGLE_CLIENT_ID=${FINAL_GOOGLE_ID}" \
              "GOOGLE_CLIENT_SECRET=${FINAL_GOOGLE_SECRET}" \
              "VAPID_PRIVATE_KEY=${FINAL_VAPID_KEY}" \
              "SHOPERP_OWNER_USERNAME=adminvanan1" \
              "SHOPERP_OWNER_PASSWORD=2026@vanan" \
              "SHOPERP_TENANT_ID=00000000-0000-0000-0000-000000000001" \
              "SHOPERP_SYSADMIN_PASSWORD=2026@vanan" \
              > .env.shoperp

            # Login to GHCR
            echo "${DEPLOY_GITHUB_TOKEN}" | sudo docker login ghcr.io -u "${DEPLOY_GITHUB_ACTOR}" --password-stdin

            # Pre-flight connectivity check (NATS + PostgreSQL on Gateway VPS)
            # Use bash /dev/tcp fallback when nc not installed
            test_port() { timeout 10 bash -c "echo > /dev/tcp/$1/$2" 2>&1; }
            echo "Testing NATS connectivity to ${DEPLOY_NATS_REMOTE_HOST}:4222..."
            test_port "${DEPLOY_NATS_REMOTE_HOST}" 4222 || { echo "::error::NATS unreachable"; exit 1; }
            echo "Testing PostgreSQL connectivity to ${DEPLOY_GATEWAY_REMOTE_HOST}:5432..."
            test_port "${DEPLOY_GATEWAY_REMOTE_HOST}" 5432 || { echo "::error::PostgreSQL unreachable"; exit 1; }

            # Pull & restart (with retry — transient network resets from ghcr.io CDN)
            for i in 1 2 3 4 5; do
              timeout 600 sudo docker compose -f docker-compose.shoperp.yml --env-file .env.shoperp pull && break
              echo "⚠️ Pull attempt $i failed, retrying in 15s..."
              sleep 15
            done
            # 2026-09-24 (deploy-window fix): healthcheck gate — wait for the new
            # container to be healthy instead of a blind sleep (same as Gateway VPS).
            # nginx proxy_next_upstream retries absorb the brief restart gap for users.
            sudo docker compose -f docker-compose.shoperp.yml --env-file .env.shoperp up -d --remove-orphans --wait --wait-timeout 240

            # Final state
            sudo docker compose -f docker-compose.shoperp.yml --env-file .env.shoperp ps

            # Verify NATS subscription
            echo "Checking OrderSyncSubscriber log..."
            sudo docker compose -f docker-compose.shoperp.yml logs shoperp 2>&1 | grep -i "OrderSyncSubscriber" | tail -5 || true

            echo "ShopERP VPS deploy complete!"
        env:
          DEPLOY_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DEPLOY_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_REPO_OWNER: ${{ github.repository_owner }}
          DEPLOY_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_VANAN_DOMAIN: ${{ secrets.VANAN_DOMAIN }}
          DEPLOY_NATS_REMOTE_HOST: ${{ secrets.GATEWAY_REMOTE_HOST }}
          DEPLOY_GATEWAY_REMOTE_HOST: ${{ secrets.GATEWAY_REMOTE_HOST }}
          DEPLOY_SHOP_INSTANCE_ID: ${{ secrets.SHOP_INSTANCE_ID }}
          DEPLOY_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          DEPLOY_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEPLOY_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DEPLOY_INTERNAL_LOYALTY_API_KEY: ${{ secrets.INTERNAL_LOYALTY_API_KEY }}

  # ============================================================
  # Job 6: Post-Deploy Smoke Test
  # ============================================================
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [impact-analysis, deploy-gateway, deploy-khachlink, deploy-shoperp]
    # Runs whenever something was deployed (deploy jobs may be individually skipped).
    if: ${{ !cancelled() && !failure() && needs.impact-analysis.outputs.deploy_action != 'noop' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log deploy scope
        run: |
          echo "deploy_action=${{ needs.impact-analysis.outputs.deploy_action }}"
          echo "deploy_set=[${{ needs.impact-analysis.outputs.deploy_set }}]"
          echo "verification_set=[${{ needs.impact-analysis.outputs.verification_set }}]"
          echo "image_tag=${{ env.IMAGE_TAG }}"

      - name: Test Gateway health
        run: |
          echo "Testing Gateway health via external IP..."
          curl -fsS --max-time 30 "http://${{ secrets.VPS_GATEWAY_HOST }}/health" || \
          curl -fsS --max-time 30 "https://api.${{ secrets.VANAN_DOMAIN }}/health" || \
          { echo "::warning::Gateway health check failed (may need SSL setup first)"; }

      - name: Test KhachLink health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_KHACHLINK_HOST }}
          username: ${{ secrets.VPS_KHACHLINK_USER }}
          key: ${{ secrets.VPS_KHACHLINK_SSH_PRIVATE_KEY }}
          script: |
            curl -fsS --max-time 30 http://localhost/health && echo "KhachLink health OK"

      - name: Test ShopERP health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_SHOP_HOST }}
          username: ${{ secrets.VPS_SHOP_USER }}
          key: ${{ secrets.VPS_SHOP_SSH_PRIVATE_KEY }}
          script: |
            # ShopERP (Blazor Server) on e2-micro VPS can hit transient issues:
            #   - "Connection reset by peer" = nginx/Kestrel closed mid-handshake (OOM? warmup? restart?)
            # Retry with backoff so we don't fail CD on a 1-off network blip,
            # but DO fail if all retries exhausted — that signals a real crash.
            for attempt in 1 2 3 4 5; do
              echo "Health check attempt $attempt/5..."
              if curl -fsS --max-time 30 http://localhost/health; then
                echo "ShopERP health OK (attempt $attempt)"
                exit 0
              fi
              echo "Attempt $attempt failed — waiting 15s before retry..."
              sleep 15
            done

            # All 5 attempts failed (~75s + 5×30s curl timeout worst case).
            # Capture diagnostics before failing so the log shows WHY.
            echo "=== ShopERP health FAILED after 5 attempts ==="
            echo "--- docker compose ps ---"
            sudo docker compose -f /opt/vanan/docker-compose.shoperp.yml --env-file /opt/vanan/.env.shoperp ps || true
            echo "--- last 80 log lines ---"
            sudo docker compose -f /opt/vanan/docker-compose.shoperp.yml --env-file /opt/vanan/.env.shoperp logs shoperp --tail=80 || true
            echo "::error::ShopERP health check failed after 5 retries. Inspect diagnostics above (OOM? config error? Kestrel crash?)."
            exit 1

      - name: Summary
        run: |
          echo "=== Multi-VPS Deploy Summary ==="
          echo "Gateway VPS: ${{ secrets.VPS_GATEWAY_HOST }}"
          echo "KhachLink VPS: ${{ secrets.VPS_KHACHLINK_HOST }}"
          echo "ShopERP VPS: ${{ secrets.VPS_SHOP_HOST }}"
          echo "ShopInstance ID: ${{ secrets.SHOP_INSTANCE_ID }}"
          echo "Image tag: ${{ env.IMAGE_TAG }}"
          echo ""
          echo "NEXT STEPS:"
          echo "1. Setup SSL certs (if not done): run scripts/init-ssl.sh on Gateway VPS"
          echo "2. Create ShopInstance record in Gateway PG (see Multi_VPS_Deployment_Guide.md §3 Bước 6)"
          echo "3. Onboard first tenant via Gateway API"
