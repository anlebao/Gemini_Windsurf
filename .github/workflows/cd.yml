name: CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.devin/**'
      - '.devin/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # Job 1: Build & push Docker images to GHCR
  # ============================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tag (git SHA short)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vanan
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: 2_Gateway/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vanan-gateway:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vanan-gateway:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build & push ShopERP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: 5_WebApps/ShopERP/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vanan-shoperp:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vanan-shoperp:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build & push KhachLink
        uses: docker/build-push-action@v5
        with:
          context: .
          file: 5_WebApps/KhachLink/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vanan-khachlink:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vanan-khachlink:latest
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================
  # Job 2: Pre-Deployment Validation — BLOCKING (Phase 0 Session 2)
  # ============================================================
  pre-deployment-validation:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          pwsh -File scripts/validate-docker-compose.ps1 -ComposeFile docker-compose.prod.yml

      - name: Validate Environment Variables (using .env.example)
        run: |
          if [ -f .env.example ]; then
            # Validate .env.example has required variables (placeholders allowed for example)
            pwsh -File scripts/validate-env-vars.ps1 -EnvFile .env.example
          else
            echo "Warning: .env.example not found, skipping env var validation"
          fi

  # ============================================================
  # Job 3: Deploy to VPS
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-and-push, pre-deployment-validation]
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VANAN_DOMAIN secret is set
        run: |
          if [ -z "${{ secrets.VANAN_DOMAIN }}" ]; then
            echo "::error::VANAN_DOMAIN GitHub secret is not set. Deploy skipped to prevent breaking VPS."
            echo "::error::Set it in: Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Name: VANAN_DOMAIN  Value: your domain (e.g. khachvip.online)"
            exit 1
          fi
          echo "VANAN_DOMAIN secret is set: ${{ secrets.VANAN_DOMAIN }}"

      - name: Prepare deploy directory on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/vanan
            sudo chown $USER:$USER /opt/vanan

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,scripts/deploy.sh,nginx/"
          target: "/opt/vanan"
          strip_components: 0

      - name: Bootstrap & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: DEPLOY_POSTGRES_PASSWORD,DEPLOY_JWT_SECRET_KEY,DEPLOY_GITHUB_TOKEN,DEPLOY_GITHUB_ACTOR,DEPLOY_REGISTRY,DEPLOY_REPO_OWNER,DEPLOY_IMAGE_TAG,DEPLOY_VANAN_DOMAIN,DEPLOY_GOOGLE_CLIENT_ID,DEPLOY_GOOGLE_CLIENT_SECRET,DEPLOY_VAPID_PRIVATE_KEY
          script: |
            set -e

            # Bootstrap Docker (idempotent)
            if ! command -v docker > /dev/null 2>&1; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi

            if ! sudo docker compose version > /dev/null 2>&1; then
              echo "Installing Docker Compose plugin..."
              sudo apt-get update -qq && sudo apt-get install -y docker-compose-plugin
            fi

            cd /opt/vanan

            # Write .env using printf (no heredoc)
            # Preserve existing GOOGLE_CLIENT_ID/SECRET if GitHub secrets are empty
            EXISTING_GOOGLE_ID=$(grep -E '^GOOGLE_CLIENT_ID=' .env 2>/dev/null | cut -d= -f2- || echo "")
            EXISTING_GOOGLE_SECRET=$(grep -E '^GOOGLE_CLIENT_SECRET=' .env 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_GOOGLE_ID="${DEPLOY_GOOGLE_CLIENT_ID:-$EXISTING_GOOGLE_ID}"
            FINAL_GOOGLE_SECRET="${DEPLOY_GOOGLE_CLIENT_SECRET:-$EXISTING_GOOGLE_SECRET}"
            # Phase 5: Preserve existing VAPID_PRIVATE_KEY if GitHub secret is empty
            EXISTING_VAPID_KEY=$(grep -E '^VAPID_PRIVATE_KEY=' .env 2>/dev/null | cut -d= -f2- || echo "")
            FINAL_VAPID_KEY="${DEPLOY_VAPID_PRIVATE_KEY:-$EXISTING_VAPID_KEY}"

            printf '%s\n' \
              "VANAN_DOMAIN=${DEPLOY_VANAN_DOMAIN}" \
              "POSTGRES_DB=VanAnCoreHub" \
              "POSTGRES_USER=vanan_admin" \
              "POSTGRES_PASSWORD=${DEPLOY_POSTGRES_PASSWORD}" \
              "PGADMIN_DEFAULT_EMAIL=admin@vanan.com" \
              "PGADMIN_DEFAULT_PASSWORD=${DEPLOY_POSTGRES_PASSWORD}" \
              "SEQ_ADMIN_PASSWORD=${DEPLOY_POSTGRES_PASSWORD}" \
              "JWT_SECRET_KEY=${DEPLOY_JWT_SECRET_KEY}" \
              "IMAGE_PREFIX=${DEPLOY_REGISTRY}/${DEPLOY_REPO_OWNER}" \
              "IMAGE_TAG=${DEPLOY_IMAGE_TAG}" \
              "GOOGLE_CLIENT_ID=${FINAL_GOOGLE_ID}" \
              "GOOGLE_CLIENT_SECRET=${FINAL_GOOGLE_SECRET}" \
              "GOOGLE_KHACHLINK_LOGIN_URL=https://diemthuong.khachvip.online/login" \
              "VAPID_PRIVATE_KEY=${FINAL_VAPID_KEY}" \
              > .env

            # Login to GHCR (use sudo to ensure docker socket access)
            echo "${DEPLOY_GITHUB_TOKEN}" | sudo docker login ghcr.io -u "${DEPLOY_GITHUB_ACTOR}" --password-stdin

            # Pull latest images & restart
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Reload nginx config (picks up any conf.d changes without downtime)
            sudo docker exec vanan-nginx nginx -s reload || true

            # Health check
            sleep 20
            sudo docker compose -f docker-compose.prod.yml ps
            echo "Deploy complete!"
        env:
          DEPLOY_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DEPLOY_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_REPO_OWNER: ${{ github.repository_owner }}
          DEPLOY_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DEPLOY_VANAN_DOMAIN: ${{ secrets.VANAN_DOMAIN }}
          DEPLOY_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          DEPLOY_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEPLOY_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
