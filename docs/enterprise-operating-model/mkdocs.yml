site_name: Van An Enterprise Operating Model
docs_dir: .
site_description: Digital Twin documentation layer — captured at 64789992
theme:
  name: material
  features: [navigation.sections, navigation.top, search.highlight, content.action.view]
plugins:
  - search
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - admonition
  - toc: {permalink: true}
nav:
