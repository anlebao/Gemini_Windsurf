# Digital Twin portal — static docs site (mkdocs-material, EOM-X5)
# Include inside the ShopERP server block of nginx/templates/vanan.multivps.conf.template:
#     include /etc/nginx/conf.d/twin-portal.location.conf;
#
# Deploy: mkdocs build -f docs/mkdocs-twin.yml → rsync docs/twin-portal-site/ → /var/www/twin/
#
# GATING (SystemAdmin-only): nav link in ShopErpMenuService hides the menu item,
# but the URL itself needs protection — pick ONE:
#   (a) auth_basic (htpasswd for sysadmins) — simplest, uncomment below
#   (b) restrict to admin IPs / VPN (allow/deny)
#   (c) proxy through an authenticated ShopERP endpoint (heavier; only if needed)

location /twin/ {
    alias /var/www/twin/;
    index index.html;
    try_files $uri $uri/ /twin/index.html;

    # Option (a): uncomment after creating /etc/nginx/.htpasswd-twin
    # auth_basic "VanAn Twin — system admin only";
    # auth_basic_user_file /etc/nginx/.htpasswd-twin;

    # Option (b): restrict to admin IPs
    # allow 203.0.113.0/24;
    # deny all;
}
