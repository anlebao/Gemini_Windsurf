user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # UTF-8 charset for all text/html responses (fixes Vietnamese font corruption)
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate Limiting — 3 zones, applied per-location in server blocks.
    #
    # api zone: 30r/s — API endpoints (authenticated, JWT-protected).
    #   High rate: API calls are cheap (no Blazor circuit, no prerender).
    #   burst=200 in location: allows 40-50 API calls in 2s (Blazor page load).
    #
    # web zone: 20r/s — page loads (HTML, Blazor prerender).
    #   burst=200 in location: allows 10+ navigations in burst.
    #
    # auth zone: 5r/m — login/OTP endpoints (brute-force protection).
    #   burst=5: max 5 attempts per minute per IP before 429.
    #
    # limit_req_status 429: return 429 Too Many Requests (not default 503)
    # so clients distinguish rate-limit from actual server failure.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_status 429;

    # Connection limiting — concurrent connections per IP (protects Blazor Server RAM)
    # Blazor Server holds circuit state in RAM per WebSocket connection.
    # Without limit_conn, attacker can open thousands of /_blazor/negotiate
    # connections → RAM exhaustion → server crash. 10 concurrent connections
    # per IP is generous (10 tabs/devices) while preventing abuse.
    limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

    include /etc/nginx/conf.d/*.conf;
}
