# ============================================================
# vanantech.io.vn — Dashboard (static HTML)
# ============================================================
server {
    listen 80;
    server_name vanantech.io.vn www.vanantech.io.vn;

    # Let's Encrypt ACME challenge (must work before SSL exists)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name vanantech.io.vn www.vanantech.io.vn;

    ssl_certificate     /etc/letsencrypt/live/vanantech.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanantech.io.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# diemthuong.vanantech.io.vn — KhachLink (customer PWA)
# ============================================================
server {
    listen 80;
    server_name diemthuong.vanantech.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name diemthuong.vanantech.io.vn;

    ssl_certificate     /etc/letsencrypt/live/vanantech.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanantech.io.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    limit_req zone=web burst=20 nodelay;

    location / {
        proxy_pass         http://vanan-khachlink:80;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SignalR WebSocket
    location /dashboardHub {
        proxy_pass         http://vanan-khachlink:80;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

