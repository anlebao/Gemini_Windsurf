version: '3.8'

# Multi-VPS Deployment — Gateway VPS (Option C)
# Deploy on: vanan-gateway VPS (PostgreSQL source of truth + NATS + Gateway + KhachLink + nginx)
# ShopERP runs on a SEPARATE VPS (vanan-shop-a) — connects to NATS via VPC internal IP.
# Usage: docker compose -f docker-compose.gateway.yml up -d
# Requires: .env.gateway file with all variables set

services:
  postgres:
    image: postgres:15-alpine
    container_name: vanan-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-VanAnCoreHub}
      - POSTGRES_USER=${POSTGRES_USER:-vanan_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vanan-network
    # Multi-VPS: expose 5432 on host so shop-a VPS can connect via VPC internal IP.
    # Security: GCP firewall rule 'allow-postgres-internal' must restrict source to shop-erp tag / VPC subnet.
    # NEVER expose 5432 to 0.0.0.0/0 on public internet.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanan_admin} -d ${POSTGRES_DB:-VanAnCoreHub}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seq:
    image: datalust/seq:latest
    container_name: vanan-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq_data:/data
    networks:
      - vanan-network
    ports:
      - "127.0.0.1:5341:80"  # Seq UI only via localhost (SSH tunnel)
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nats:
    image: nats:2.10-alpine
    container_name: vanan-nats
    # Multi-VPS: NATS must listen on 0.0.0.0 so shop-a VPS can connect via VPC internal IP.
    # Port 4222 published to host so remote VPS reaches it via <gateway-internal-ip>:4222.
    # Port 8222 (monitoring) only on localhost for security.
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    ports:
      - "4222:4222"        # NATS client — accessible from shop-a VPS via VPC (firewall rule allow-nats-internal)
      - "127.0.0.1:8222:8222"  # NATS monitoring — localhost only
    volumes:
      - nats_data:/data/jetstream
    networks:
      - vanan-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-gateway:${IMAGE_TAG:-latest}
    container_name: vanan-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-VanAnCoreHub};Username=${POSTGRES_USER:-vanan_admin};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Nats=nats://nats:4222
      - Nats__Url=nats://nats:4222
      - NATS__Url=nats://nats:4222
      - Authentication__JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Secret=${JWT_SECRET_KEY}
      - Cors__AllowedOrigins__0=https://${VANAN_DOMAIN}
      - Cors__AllowedOrigins__1=https://diemthuong.${VANAN_DOMAIN}
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      # Multi-VPS: ShopERP BaseUrl points to REMOTE VPS via VPC internal IP
      - ShopERP__BaseUrl=http://${SHOPERP_REMOTE_HOST}:80/
      - InternalLoyalty__ApiKey=${INTERNAL_LOYALTY_API_KEY:-vanan-internal-loyalty-prod-2026}
    networks:
      - vanan-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  khachlink:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-khachlink:${IMAGE_TAG:-latest}
    container_name: vanan-khachlink
    networks:
      - vanan-network
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    container_name: vanan-nginx
    environment:
      - VANAN_DOMAIN=${VANAN_DOMAIN}
      - SHOPERP_REMOTE_HOST=${SHOPERP_REMOTE_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/docker-entrypoint.multivps.sh:/docker-entrypoint.sh:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    networks:
      - vanan-network
    depends_on:
      - gateway
      - khachlink
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: vanan-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
  seq_data:
  certbot_www:
  certbot_conf:

networks:
  vanan-network:
    driver: bridge
