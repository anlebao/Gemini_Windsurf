version: '3.8'

services:
  # Gateway - API Gateway (YARP Reverse Proxy)
  gateway:
    build:
      context: ..
      dockerfile: 2_Gateway/Dockerfile
    container_name: vanan-gateway-test
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # KhachLink - Customer-facing PWA
  khachlink:
    build:
      context: ..
      dockerfile: 5_WebApps/KhachLink/Dockerfile
    container_name: vanan-khachlink-test
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - GATEWAY_URL=http://gateway:5001
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ShopERP - Staff/Admin Accounting UI
  shoperp:
    build:
      context: ..
      dockerfile: 5_WebApps/ShopERP/Dockerfile
    container_name: vanan-shoperp-test
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - GATEWAY_URL=http://gateway:5001
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  default:
    name: vanan-test-network
