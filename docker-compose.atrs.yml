# vanan-atrs — Account Trust & Recovery Service (ADR-001, D2)
# Own PostgreSQL (trust registry CROSS-tenant) + own image, port 5080.
services:
  atrs:
    image: ghcr.io/anlebao/vanan-atrs:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__Atrs: ${ATRS_PG_CONNECTION}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET}
      Atrs__ShopErpBaseUrl: ${ATRS_SHOPERP_BASE_URL}
      Atrs__GatewayBaseUrl: ${ATRS_GATEWAY_BASE_URL}
      # ATRS-5 (Wave 2): WebAuthn RP — multi-subdomain passkey share qua apex RP ID.
      Atrs__WebAuthn__RpId: ${ATRS_WEBAUTHN_RPID:-timlathay.com}
      Atrs__WebAuthn__Origins__0: ${ATRS_WEBAUTHN_ORIGIN_0:-https://vanan.timlathay.com}
      Atrs__WebAuthn__Origins__1: ${ATRS_WEBAUTHN_ORIGIN_1:-https://commienphi.timlathay.com}
      Atrs__WebAuthn__Origins__2: ${ATRS_WEBAUTHN_ORIGIN_2:-https://diemthuong2.khachvip.online}
      Atrs__WebAuthn__Origins__3: ${ATRS_WEBAUTHN_ORIGIN_3:-https://hoptacxa.timlathay.com}
      InternalLoyalty__ApiKey: ${INTERNAL_API_KEY}
      # ATRS-17 (FR-001): Gateway→atrs internal account-status sync key.
      Atrs__InternalApiKey: ${ATRS_INTERNAL_API_KEY:-}
      # ATRS-21: atrs→ShopERP mint customer_token sau passkey login — cùng shared internal key
      # với InternalLoyalty:ApiKey của ShopERP (1 secret, không tạo mới).
      Atrs__ShopErpInternalApiKey: ${INTERNAL_LOYALTY_API_KEY:-}
      Atrs__PasskeyLogin__MaxBeginPerHour: ${ATRS_PASSKEY_LOGIN_MAX_BEGIN_PER_HOUR:-20}
      # Wave 4 (D9): R2 evidence attachments — reuse R2 creds; bucket chung, prefix atrs-evidence/.
      Atrs__R2__Endpoint: ${R2_ENDPOINT:-https://18947627801f833aecc202f086d66af5.r2.cloudflarestorage.com}
      Atrs__R2__AccessKey: ${R2_ACCESS_KEY:-}
      Atrs__R2__SecretKey: ${R2_SECRET_KEY:-}
      Atrs__R2__BucketName: ${R2_BUCKET_NAME:-vanan-guard-photos}
      ASPNETCORE_URLS: http://+:5080
    ports:
      - "5080:5080"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ATRS_PG_DB}
      POSTGRES_USER: ${ATRS_PG_USER}
      POSTGRES_PASSWORD: ${ATRS_PG_PASSWORD}
    volumes:
      - atrs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATRS_PG_USER} -d ${ATRS_PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  atrs_pgdata: