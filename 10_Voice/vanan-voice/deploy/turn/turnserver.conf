# vanan-voice — Coturn deployment (SRS v1.1 §8.2–8.3)
# Template — secrets injected by deploy-turn.sh (never commit real values).
# External ports: STUN/TURN UDP 3478 · TURN TCP 3478 · TURN TLS 5349 · relay range below.

# --- Listen / advertise ---
listening-port=3478
tls-listening-port=5349
fingerprint
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=__PUBLIC_HOST__

# --- Authentication: TURN REST API (voice service issues HMAC credentials, SEC-004) ---
use-auth-secret
static-auth-secret=__SECRET__
realm=__REALM__
# REST auth (use-auth-secret) only — no long-term credential mechanism needed.

# --- Relay ---
min-port=__MIN_RELAY_PORT__
max-port=__MAX_RELAY_PORT__
# UDP primary (SRS §8.2) + TCP/TLS fallback where supported.
allow-loopback-peers
no-multicast-peers

# --- Security / operational ---
no-cli
no-tlsv1
no-tlsv1_1
no-sslv2
no-sslv3
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=0.0.0.0-255.255.255.255
# Bandwidth / allocation caps (abuse protection, SEC-005).
max-bps=1048576
user-quota=12
total-quota=1200

# --- Monitoring ---
no-stdout-log
log-file=/var/log/turnserver.log
syslog