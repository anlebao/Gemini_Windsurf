version: '3.8'

# Directory SSR container — standalone compose for local/testing
# Production deploy uses docker-compose.khachlink.yml (Directory runs on KhachLink VPS)
# Serves Directory profile domains (timlathay.com, etc.)
# Commerce profile domains served by vanan-khachlink-1 (nginx + WASM)

services:
  directory:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-directory:${IMAGE_TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Gateway__BaseUrl=http://${GATEWAY_REMOTE_HOST}:80/
      # Phí nền tảng P4: metering client (public route via gateway nginx; caller "directory")
      - Metering__BaseUrl=https://app2.${VANAN_DOMAIN}/admin/metering/api/
      - Metering__CallerId=directory
      - Metering__CallerKey=${METERING_KEY_DIRECTORY}
      - Metering__PlatformTenantId=${METERING_PLATFORM_TENANT}
    networks:
      - vanan-network
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vanan-network:
    driver: bridge
