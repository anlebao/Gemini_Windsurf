# nginx config for KhachLink VPS
# Phase 1 WASM conversion: serve static files + fallback to index.html for client-side routing
# Directory SSR: map-based routing — Directory profile domains proxy to directory container

# Directory domain detection — map file (reload khi thêm domain)
# Updated by scripts/add-directory-domain.sh
map $host $is_directory {
    default 0;
    timlathay.com 1;  # Enabled — Directory SSR container live on KhachLink VPS
}

# Map $is_directory (0/1) to upstream URL (empty = serve static WASM, non-empty = proxy to SSR)
# Empty string when not a Directory domain → location / falls through to try_files
# "http://directory:8080" when Directory domain → proxy_pass with variable (deferred DNS)
map $is_directory $directory_target {
    default "";
    1      "http://directory:8080";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve container names at request time (not startup).
    # Required for proxy_pass with variable: nginx resolves $directory_target's
    # hostname via this resolver at request time, not at config parse time.
    # Without this, nginx fails to start if the directory container is down.
    resolver 127.0.0.11 valid=30s;

    # WebSocket + HTTP proxy headers — apply to all proxy_pass locations
    # (location /, /_framework/, =/_framework/blazor.boot.json, /_blazor).
    # Critical for Blazor SSR interactive render mode: the /_blazor endpoint
    # upgrades to WebSocket; without proxy_http_version 1.1 + Upgrade/Connection
    # headers, nginx uses HTTP/1.0 to backend and drops the upgrade →
    # "WebSocket failed to connect. The connection could not be found on the server."
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;  # keep WebSocket alive for long sessions

    # Gzip compression for DLLs + WASM + JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm application/octet-stream;
    gzip_min_length 1024;

    # Serve pre-compressed .gz files generated by Blazor WASM SDK (dotnet publish
    # emits .dll.gz, .wasm.gz, .blazor.boot.json.gz under wwwroot/_framework/).
    # gzip_static is a built-in nginx module (no extra image needed) — it serves
    # the .gz file directly with Content-Encoding: gzip, skipping on-the-fly
    # compression. Critical for mobile: ~10MB raw DLL/wasm → ~3MB gzipped payload,
    # far less likely to hit ERR_CONNECTION_CLOSED on slow mobile networks.
    gzip_static on;

    # _framework/* assets: revalidate always (Blazor wasm/dll filenames are NOT
    # content-hashed — they change between deploys but keep the same name).
    # Was "immutable, max-age=31536000" — caused browser to serve stale wasm
    # without revalidation → SRI integrity mismatch after deploys.
    location /_framework/ {
        # Directory SSR domains: proxy to SSR container (serves blazor.web.js
        # via Blazor static files middleware). Without this, nginx tries to
        # serve from WASM wwwroot → 404 HTML → MIME text/html → browser refuses.
        if ($directory_target) {
            proxy_pass $directory_target;
            break;
        }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache icons + images
    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # service-worker.js — no cache (must always fetch latest)
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Blazor WASM boot config — no cache (must always fetch latest)
    location = /_framework/blazor.boot.json {
        if ($directory_target) {
            proxy_pass $directory_target;
            break;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # manifest.json — MUST be served as application/manifest+json (not application/json)
    # Chrome requires this Content-Type to recognize it as a PWA manifest.
    # With application/json + nosniff, Chrome does not process it as manifest
    # → beforeinstallprompt never fires → PWA install broken.
    # nginx default mime.types maps .json → application/json, so we override
    # using a types{} block inside this location. Note: types{} in a location
    # block REPLACES the inherited mime.types, so we must include all needed
    # mappings here (only manifest.json is served from this location).
    location = /manifest.json {
        types {
            application/manifest+json json;
        }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Main location — handles both Directory SSR proxy and Commerce WASM static files.
    # When $directory_target is set (Directory domain), proxy to SSR container.
    # When empty (Commerce domain), serve static WASM files with SPA fallback.
    # proxy_pass with a variable defers DNS resolution to request time via resolver,
    # so nginx starts even if the directory container is temporarily down.
    location / {
        if ($directory_target) {
            proxy_pass $directory_target;
            break;
        }
        try_files $uri $uri/ /index.html;
    }
}
