# nginx config for Blazor WebAssembly SPA
# Phase 1 WASM conversion: serve static files + fallback to index.html for client-side routing

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for DLLs + WASM + JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm application/octet-stream;
    gzip_min_length 1024;

    # _framework/* assets: revalidate always (Blazor wasm/dll filenames are NOT
    # content-hashed — they change between deploys but keep the same name).
    # Was "immutable, max-age=31536000" — caused browser to serve stale wasm
    # without revalidation → SRI integrity mismatch after deploys.
    location /_framework/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache icons + images
    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # service-worker.js — no cache (must always fetch latest)
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Blazor WASM boot config — no cache (must always fetch latest)
    location = /_framework/blazor.boot.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # manifest.json — MUST be served as application/manifest+json (not application/json)
    # Chrome requires this Content-Type to recognize it as a PWA manifest.
    # With application/json + nosniff, Chrome does not process it as manifest
    # → beforeinstallprompt never fires → PWA install broken.
    # nginx default mime.types maps .json → application/json, so we override
    # using a types{} block inside this location.
    location = /manifest.json {
        types {
            application/manifest+json manifest.json;
        }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback: all routes serve index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
