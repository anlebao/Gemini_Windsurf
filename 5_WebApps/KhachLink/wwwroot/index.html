    <meta name="theme-color" content="#2c5f2d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tìm Là Thấy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Vạn An — ứng dụng của bạn" />
    <title>Vạn An App</title>
    <script>
        // W3-2 (FR-L7): head meta động theo instance — fetch /api/public/khachlink-instances/head-meta
        // (nginx proxy → Gateway, resolve theo Host) rồi set title/description/theme-color
        // TRƯỚC khi WASM boot. Fail → giữ default tĩnh (offline-safe).
        (function () {
            fetch('/api/public/khachlink-instances/head-meta', { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (m) {
                    if (!m) return;
                    if (m.name) document.title = m.name;
                    if (m.description) {
                        var d = document.querySelector('meta[name="description"]');
                        if (d) d.setAttribute('content', m.description);
                    }
                    if (m.themeColor) {
                        var t = document.querySelector('meta[name="theme-color"]');
                        if (t) t.setAttribute('content', m.themeColor);
                        var a = document.querySelector('meta[name="apple-mobile-web-app-title"]');
                        if (a && m.name) a.setAttribute('content', m.name);
                    }
                })
                .catch(function () { /* offline / endpoint lỗi → default tĩnh */ });
        })();
    </script>
    <script src="/js/lib/qr/html5-qrcode.min.js"></script>
    <script src="/js/lib/qr/jsQR.js"></script>
</head>

<body>
    <div id="app">
        <!-- FR-L6: skeleton Home thay spinner trơ — giảm perceived wait, preview layout thật -->
        <div id="vanan-loading-screen">
            <div class="vls-header"></div>
            <div class="vls-body">
                <div class="vls-search"></div>
                <div class="vls-cards">
                    <div class="vls-card"></div>
                    <div class="vls-card"></div>
                    <div class="vls-card"></div>
                    <div class="vls-card"></div>
                </div>
            </div>
            <p class="vls-text">Đang tải…</p>
        </div>
        <style>
            #vanan-loading-screen {
                position: fixed; inset: 0; background: #f9f9f9;
                font-family: system-ui, sans-serif; z-index: 9999;
            }
            .vls-header {
                height: 52px;
                background: linear-gradient(135deg, #2c5f2d, #4a8c4a);
            }
            .vls-body { max-width: 640px; margin: 0 auto; padding: 16px; }
            .vls-search {
                height: 52px; border-radius: 9999px; background: #e9ecef; margin-bottom: 20px;
            }
            .vls-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .vls-card {
                height: 160px; border-radius: 10px;
                background: linear-gradient(100deg, #ececec 40%, #f5f5f5 50%, #ececec 60%);
                background-size: 200% 100%;
                animation: vls-shimmer 1.4s linear infinite;
            }
            .vls-text {
                text-align: center; color: #6c757d; font-size: 14px; margin-top: 20px;
            }
            @keyframes vls-shimmer {
                to { background-position: -200% 0; }
            }
            @media (min-width: 768px) {
                .vls-cards { grid-template-columns: repeat(4, 1fr); }
            }
        </style>
    </div>

    <!-- VOICE SERVICE P4 (2026-11-11): gọi thoại trong chat — SDK (SignalR + media + signaling) + bridge Blazor -->
    <script src="/_content/VanAn.UI.Platform/js/signalr.min.js"></script>
    <script src="/_content/VanAn.UI.Platform/js/voice-media.js"></script>
    <script src="/_content/VanAn.UI.Platform/js/voice-sdk.js"></script>
    <script src="/_content/VanAn.UI.Platform/js/voice-chat.js"></script>
    <script src="/js/qrcode.js"></script>
    <script src="/js/qr-wallet.js"></script>
    <script src="/js/app-install-tracker.js"></script>
    <script src="/js/voice-note.js"></script>
    <script src="/js/profile-toast.js"></script>
    <script src="/js/metering.js"></script>
    <script src="/lib/driver.js/driver.min.js"></script>
    <script src="/js/onboarding-tour.js"></script>
    <script src="/js/vanan-interop.js"></script>
    <!-- Self-serve onboarding (/onboard): OCR + wizard interop. OCR worker lazy-loads
         Tesseract assets từ /js/lib/ocr chỉ khi user chụp ảnh đầu tiên. -->
    <script src="/js/onboarding-ocr.js" defer></script>
    <script src="/js/onboarding-wizard.js" defer></script>
    <!-- Turnstile site key (PUBLIC value). Empty = dev mode (widget not rendered, Gateway skips verify).
         Set this at deploy time when Turnstile:SiteKey is configured on the Gateway. -->
    <script>window.vananTurnstileSiteKey = '';</script>
    <script>
        // Register service worker on app startup
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.vananPWA && typeof window.vananPWA.registerServiceWorker === 'function') {
                try {
                    await window.vananPWA.registerServiceWorker();
                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                }
            }
        });
    </script>
    <style>
        /* Issue 6: Ẩn Blazor default reconnect dialog (modal full-screen) */
        #components-reconnect-modal {
            display: none !important;
        }
        /* Issue 7: Merge reconnect indicator with home icon in mobile bottom nav.
           Default (connected): home icon = blue.
           Disconnected (body.vanan-disconnected): home icon = red + pulse animation.
           Reconnecting (body.vanan-reconnecting): home icon = orange + spin animation. */
        .mobile-bottom-nav a[href="/"] i.bi-house-door-fill {
            color: #0d6efd !important; /* blue = connected */
            transition: color 0.3s ease;
        }
        body.vanan-reconnecting .mobile-bottom-nav a[href="/"] i.bi-house-door-fill {
            color: #fd7e14 !important; /* orange = reconnecting */
            animation: vanan-home-pulse 1s ease-in-out infinite;
        }
        body.vanan-disconnected .mobile-bottom-nav a[href="/"] i.bi-house-door-fill {
            color: #dc3545 !important; /* red = disconnected */
            animation: vanan-home-pulse 0.8s ease-in-out infinite;
        }
        @keyframes vanan-home-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.15); }
        }
    </style>
    <script>
        // Issue 7: Toggle body classes based on Blazor connection state.
        // Home icon color changes via CSS (blue=connected, orange=reconnecting, red=disconnected).
        (function() {
            function setReconnecting() {
                document.body.classList.add('vanan-reconnecting');
                document.body.classList.remove('vanan-disconnected');
            }
            function setConnected() {
                document.body.classList.remove('vanan-reconnecting', 'vanan-disconnected');
            }
            function setDisconnected() {
                document.body.classList.remove('vanan-reconnecting');
                document.body.classList.add('vanan-disconnected');
            }

            document.addEventListener('DOMContentLoaded', function() {
                // Blazor fires these events on the document:
                // components-reconnect-show: reconnection attempt starts (orange)
                // components-reconnect-hide: reconnection succeeds (blue)
                // components-reconnect-failed: all retries exhausted (red)
                document.addEventListener('components-reconnect-show', setReconnecting);
                document.addEventListener('components-reconnect-hide', setConnected);
                document.addEventListener('components-reconnect-failed', setDisconnected);
            });
        })();
    </script>
</body>

</html>
