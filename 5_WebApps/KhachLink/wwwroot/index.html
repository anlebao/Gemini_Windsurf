<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <base href="/" />
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="VanAn.KhachLink.styles.css" />
    <link rel="stylesheet" href="/lib/leaflet/leaflet.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <meta name="theme-color" content="#8B4513" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vạn An" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Hệ thống đặt hàng thông minh của Vạn An Group" />
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
            integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="app">
        <div id="vanan-loading-screen" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8B4513,#D2691E);color:white;font-family:system-ui,sans-serif;flex-direction:column;">
            <div style="width:56px;height:56px;border:4px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:vanan-spin 0.8s linear infinite;margin:0 auto 16px;"></div>
            <p style="font-size:18px;font-weight:500;text-shadow:0 2px 8px rgba(0,0,0,0.5);">Vạn An đang tải...</p>
        </div>
        <style>
            @@keyframes vanan-spin { to { transform: rotate(360deg); } }
        </style>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="/js/pwa.js"></script>
    <script src="/js/qr-scanner.js"></script>
    <script src="/js/cart-animation.js"></script>
    <script src="/js/fingerprint.js"></script>
    <script src="/lib/leaflet/leaflet.js"></script>
    <script src="/js/leaflet.js"></script>
    <script src="/js/qrcode.js"></script>
    <script src="/js/app-install-tracker.js"></script>
    <script>
        // Register service worker on app startup
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.vananPWA && typeof window.vananPWA.registerServiceWorker === 'function') {
                try {
                    await window.vananPWA.registerServiceWorker();
                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                }
            }
        });
    </script>
    <style>
        /* Issue 6: Ẩn Blazor default reconnect dialog (modal full-screen) */
        #components-reconnect-modal {
            display: none !important;
        }
        /* Issue 7: Merge reconnect indicator with home icon in mobile bottom nav.
           Default (connected): home icon = blue.
           Disconnected (body.vanan-disconnected): home icon = red + pulse animation.
           Reconnecting (body.vanan-reconnecting): home icon = orange + spin animation. */
        .mobile-bottom-nav a[href="/"] i.bi-house-door-fill {
            color: #0d6efd !important; /* blue = connected */
            transition: color 0.3s ease;
        }
        body.vanan-reconnecting .mobile-bottom-nav a[href="/"] i.bi-house-door-fill {
            color: #fd7e14 !important; /* orange = reconnecting */
            animation: vanan-home-pulse 1s ease-in-out infinite;
        }
        body.vanan-disconnected .mobile-bottom-nav a[href="/"] i.bi-house-door-fill {
            color: #dc3545 !important; /* red = disconnected */
            animation: vanan-home-pulse 0.8s ease-in-out infinite;
        }
        @@keyframes vanan-home-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.15); }
        }
    </style>
    <script>
        // Issue 7: Toggle body classes based on Blazor connection state.
        // Home icon color changes via CSS (blue=connected, orange=reconnecting, red=disconnected).
        (function() {
            function setReconnecting() {
                document.body.classList.add('vanan-reconnecting');
                document.body.classList.remove('vanan-disconnected');
            }
            function setConnected() {
                document.body.classList.remove('vanan-reconnecting', 'vanan-disconnected');
            }
            function setDisconnected() {
                document.body.classList.remove('vanan-reconnecting');
                document.body.classList.add('vanan-disconnected');
            }

            document.addEventListener('DOMContentLoaded', function() {
                // Blazor fires these events on the document:
                // components-reconnect-show: reconnection attempt starts (orange)
                // components-reconnect-hide: reconnection succeeds (blue)
                // components-reconnect-failed: all retries exhausted (red)
                document.addEventListener('components-reconnect-show', setReconnecting);
                document.addEventListener('components-reconnect-hide', setConnected);
                document.addEventListener('components-reconnect-failed', setDisconnected);
            });
        })();
    </script>
</body>

</html>
