version: '3.8'

# Production compose - v1 SaaS deployment (PostgreSQL only)
# Pulls pre-built images from GHCR
# Requires .env file with all variables set
# Usage: docker compose -f docker-compose.prod.yml up -d
# NOTE: For v2 Hybrid Edge/Cloud deployment, use docker-compose.edge.yml

services:
  postgres:
    image: postgres:15-alpine
    container_name: vanan-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-VanAnCoreHub}
      - POSTGRES_USER=${POSTGRES_USER:-vanan_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vanan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanan_admin} -d ${POSTGRES_DB:-VanAnCoreHub}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seq:
    image: datalust/seq:latest
    container_name: vanan-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq_data:/data
    networks:
      - vanan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nats:
    image: nats:2.10-alpine
    container_name: vanan-nats
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    volumes:
      - nats_data:/data/jetstream
    networks:
      - vanan-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-gateway:${IMAGE_TAG:-latest}
    container_name: vanan-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-VanAnCoreHub};Username=${POSTGRES_USER:-vanan_admin};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Nats=nats://nats:4222
      - Nats__Url=nats://nats:4222
      - NATS__Url=nats://nats:4222
      - Authentication__JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Secret=${JWT_SECRET_KEY}
      - Cors__AllowedOrigins__0=https://app.${VANAN_DOMAIN}
      - Cors__AllowedOrigins__1=https://diemthuong.${VANAN_DOMAIN}
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      # Phase 3.6: Explicit ShopERP BaseUrl — prevents port 5003 fallback (appsettings.Development.json leak)
      - ShopERP__BaseUrl=http://shoperp:80/
      # Loyalty Consistency Fix Phase 0: Internal API key for service-to-service auth (ShopERP → Gateway)
      - InternalLoyalty__ApiKey=${INTERNAL_LOYALTY_API_KEY:-vanan-internal-loyalty-prod-2026}
    networks:
      - vanan-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  shoperp:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-shoperp:${IMAGE_TAG:-latest}
    container_name: vanan-shoperp
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - Authentication__Authority=https://api.${VANAN_DOMAIN}
      - ExternalUrls__KhachLink=https://diemthuong.${VANAN_DOMAIN}
      - Seed__OwnerUsername=${SHOPERP_OWNER_USERNAME:-adminvanan1}
      - Seed__OwnerPassword=${SHOPERP_OWNER_PASSWORD:-2026@vanan}
      - Seed__TenantId=${SHOPERP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      - Seed__SysAdminPassword=${SHOPERP_SYSADMIN_PASSWORD:-2026@vanan}
      # WAVE 2 (2026-07-10): Accounting always online on PostgreSQL (ADR-001)
      - ConnectionStrings__AccountingConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-VanAnCoreHub};Username=${POSTGRES_USER:-vanan_admin};Password=${POSTGRES_PASSWORD}
      # Tiered Auth Phase 1 (2026-07-13): Google OAuth — production credentials via env vars
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Google__CallbackBaseUrl=${GOOGLE_CALLBACK_BASE_URL:-https://api.${VANAN_DOMAIN}}
      - Google__KhachLinkLoginUrl=${GOOGLE_KHACHLINK_LOGIN_URL:-https://diemthuong.${VANAN_DOMAIN}/login}
      # SaaS W1: ValidateProductionConfig sentinel keys — set to non-placeholder values
      - Jwt__Secret=${JWT_SECRET_KEY}
      - DataProtection__KeyDirectory=/app/keys
      - Brevo__ApiKey=not-configured
      - Brevo__SenderEmail=noreply@${VANAN_DOMAIN}
      - Esms__ApiKey=not-configured
      - Esms__SecretKey=not-configured
      - Esms__BrandName=VanAn
      - ConnectionStrings__Redis=not-configured
      - Authentication__ClientSecret=not-configured
      # Sync: NATS Outbox events Gateway (PostgreSQL) → ShopERP (SQLite)
      - Nats__Url=nats://nats:4222
      - ConnectionStrings__Nats=nats://nats:4222
      # Phase 4: ShopInstance routing — this ShopERP's ShopInstance Guid.
      # VPS is single-instance, uses default tenant's ShopInstance Guid (seeded by Phase 1 migration).
      - SHOP_INSTANCE_ID=00000000-0000-0000-0000-000000000001
      - ShopInstance__Id=00000000-0000-0000-0000-000000000001
      # Cookie auth: share across khachvip.online and www.khachvip.online
      - Auth__CookieDomain=.${VANAN_DOMAIN}
      # SQLite DB persistent volume (survives container recreate/deploys)
      - ConnectionStrings__DefaultConnection=Data Source=/app/keys/vanan_shoperp.db
      # Phase 5: Web Push VAPID private key (env var only — never in source code).
      # Public key is in appsettings.json (not sensitive). See docs/AI/VAPID_KEY_GENERATION_GUIDE.md.
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      # Loyalty Consistency Fix Phase 0: Internal API key for service-to-service auth (ShopERP → Gateway)
      # Must match Gateway's InternalLoyalty__ApiKey. Used by AllianceWalletServiceHttpProxy + LoyaltyModeResolverHttpProxy.
      - InternalLoyalty__ApiKey=${INTERNAL_LOYALTY_API_KEY:-vanan-internal-loyalty-prod-2026}
      # Gateway internal BaseUrl for HTTP proxy calls (Docker network — Gateway container name)
      - Gateway__BaseUrl=http://gateway:80
    volumes:
      - shoperp_data:/app/keys
    networks:
      - vanan-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  khachlink:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-khachlink:${IMAGE_TAG:-latest}
    container_name: vanan-khachlink
    # Phase 1 WASM conversion: KhachLink is now Blazor WebAssembly served by nginx.
    # No ASPNETCORE env vars needed — nginx serves static files.
    # Gateway URL is configured in wwwroot/appsettings.json (baked into image at publish time).
    networks:
      - vanan-network
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  

  

  nginx:
    image: nginx:1.25-alpine
    container_name: vanan-nginx
    environment:
      - VANAN_DOMAIN=${VANAN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro    # envsubst templates — entrypoint generates conf.d/vanan.conf
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    networks:
      - vanan-network
    depends_on:
      - gateway
      - shoperp
      - khachlink
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: vanan-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
  seq_data:
  shoperp_data:
  certbot_www:
  certbot_conf:

networks:
  vanan-network:
    driver: bridge
