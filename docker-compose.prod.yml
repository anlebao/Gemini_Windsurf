version: '3.8'

# Production compose - pulls pre-built images from GHCR
# Requires .env file with all variables set
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: vanan-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-VanAnCoreHub}
      - POSTGRES_USER=${POSTGRES_USER:-vanan_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vanan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanan_admin} -d ${POSTGRES_DB:-VanAnCoreHub}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seq:
    image: datalust/seq:latest
    container_name: vanan-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq_data:/data
    networks:
      - vanan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nats:
    image: nats:2.10-alpine
    container_name: vanan-nats
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    volumes:
      - nats_data:/data/jetstream
    networks:
      - vanan-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  corehub:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-corehub:${IMAGE_TAG:-latest}
    container_name: vanan-corehub
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-VanAnCoreHub};Username=${POSTGRES_USER:-vanan_admin};Password=${POSTGRES_PASSWORD}
      - NATS__Url=nats://nats:4222
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    networks:
      - vanan-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-gateway:${IMAGE_TAG:-latest}
    container_name: vanan-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-VanAnCoreHub};Username=${POSTGRES_USER:-vanan_admin};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Nats=nats://nats:4222
      - Nats__Url=nats://nats:4222
      - CoreHub__BaseUrl=http://corehub:80
      - Authentication__JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    networks:
      - vanan-network
    depends_on:
      - corehub
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  shoperp:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-shoperp:${IMAGE_TAG:-latest}
    container_name: vanan-shoperp
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-saas}  # v1 SaaS (default) or v2 hybrid
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - Authentication__Authority=https://api.vanantech.io.vn
      - Seed__OwnerUsername=${SHOPERP_OWNER_USERNAME:-adminvanan1}
      - Seed__OwnerPassword=${SHOPERP_OWNER_PASSWORD:-2026@vanan}
      - Seed__TenantId=${SHOPERP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
    volumes:
      - shoperp_data:/app
    networks:
      - vanan-network
    depends_on:
      - corehub
      # Sidecar dependency (v2 hybrid) - Phase 1: exists but not actively used
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  khachlink:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-khachlink:${IMAGE_TAG:-latest}
    container_name: vanan-khachlink
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-saas}  # v1 SaaS (default) or v2 hybrid
      - Gateway__BaseUrl=https://api.vanantech.io.vn
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    networks:
      - vanan-network
    depends_on:
      - gateway
      # Sidecar dependency (v2 hybrid) - Phase 1: exists but not actively used
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # SQLite local databases for offline-first stations (v2 Hybrid Edge/Cloud)
  # Phase 1: Sidecars added but not active in v1 SaaS
  shoperp-sqlite:
    image: alpine:3.19
    container_name: vanan-shoperp-sqlite
    command: ["sh", "-c", "mkdir -p /data && touch /data/shoperp.db && tail -f /dev/null"]
    volumes:
      - shoperp_sqlite_data:/data
    networks:
      - vanan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  khachlink-sqlite:
    image: alpine:3.19
    container_name: vanan-khachlink-sqlite
    command: ["sh", "-c", "mkdir -p /data && touch /data/khachlink.db && tail -f /dev/null"]
    volumes:
      - khachlink_sqlite_data:/data
    networks:
      - vanan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  order-station-sqlite:
    image: alpine:3.19
    container_name: vanan-order-station-sqlite
    command: ["sh", "-c", "mkdir -p /data && touch /data/order.db && tail -f /dev/null"]
    volumes:
      - order_sqlite_data:/data
    networks:
      - vanan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # NATS sync workers for v2 Hybrid Edge/Cloud (Phase 2: active when DEPLOYMENT_MODE=hybrid)
  shoperp-nats-sync:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-shoperp:${IMAGE_TAG:-latest}
    container_name: vanan-shoperp-nats-sync
    command: ["dotnet", "VanAn.ShopERP.dll", "--sync-worker"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-saas}
      - SQLITE_DB_PATH=/data/shoperp.db
      - NATS__Url=nats://nats:4222
      - Sync__PollIntervalMs=1000
      - Sync__BatchSize=50
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    volumes:
      - shoperp_sqlite_data:/data
    networks:
      - vanan-network
    depends_on:
      nats:
        condition: service_healthy
      shoperp-sqlite:
        condition: service_started
    profiles:
      - hybrid
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m

  khachlink-nats-sync:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-khachlink:${IMAGE_TAG:-latest}
    container_name: vanan-khachlink-nats-sync
    command: ["dotnet", "VanAn.KhachLink.dll", "--sync-worker"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-saas}
      - SQLITE_DB_PATH=/data/khachlink.db
      - NATS__Url=nats://nats:4222
      - Sync__PollIntervalMs=1000
      - Sync__BatchSize=50
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    volumes:
      - khachlink_sqlite_data:/data
    networks:
      - vanan-network
    depends_on:
      nats:
        condition: service_healthy
      khachlink-sqlite:
        condition: service_started
    profiles:
      - hybrid
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m

  order-station-nats-sync:
    image: ${IMAGE_PREFIX:-ghcr.io/anlebao}/vanan-shoperp:${IMAGE_TAG:-latest}
    container_name: vanan-order-station-nats-sync
    command: ["dotnet", "VanAn.ShopERP.dll", "--sync-worker", "--station=order"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-saas}
      - SQLITE_DB_PATH=/data/order.db
      - NATS__Url=nats://nats:4222
      - Sync__PollIntervalMs=1000
      - Sync__BatchSize=50
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    volumes:
      - order_sqlite_data:/data
    networks:
      - vanan-network
    depends_on:
      nats:
        condition: service_healthy
      order-station-sqlite:
        condition: service_started
    profiles:
      - hybrid
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m

  nginx:
    image: nginx:1.25-alpine
    container_name: vanan-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d          # writable: entrypoint swaps to HTTP-only if no cert
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    networks:
      - vanan-network
    depends_on:
      - gateway
      - shoperp
      - khachlink
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: vanan-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
  seq_data:
  shoperp_data:
  certbot_www:
  certbot_conf:
  # SQLite persistent volumes for v2 Hybrid Edge/Cloud (Phase 1: added, not active)
  shoperp_sqlite_data:
    driver: local
  khachlink_sqlite_data:
    driver: local
  order_sqlite_data:
    driver: local

networks:
  vanan-network:
    driver: bridge
